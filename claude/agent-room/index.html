<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BadClaudio — Agent Room</title>
<link rel="icon" href="/claudio.ico">
<style>
  :root { --r:#ff164f; --ok:#66ff75; --bg:#0a0c10; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); font:12px/1.35 Consolas,monospace; overflow:hidden; color:#e8e8ee; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; gap:8px; align-items:center;
         padding:5px 10px; background:#101218; border-bottom:1px solid #3a1520; font-size:11px; }
  #bar .brand { color:var(--r); font-weight:900; letter-spacing:1px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:#555; vertical-align:middle; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #keysTxt { color:#9aa; }
  #world { position:absolute; inset:26px 0 64px 0; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  #roster { position:fixed; left:0; right:0; bottom:22px; z-index:5; display:flex; gap:5px; padding:4px 8px;
            overflow-x:auto; background:#0b0d13; border-top:1px solid #23262e; }
  .chip { flex:0 0 auto; padding:3px 7px; background:#151821; border:1px solid #2a2e3a; border-radius:10px;
          font-size:10px; white-space:nowrap; }
  .chip.out { border-color:#ff8a5c; color:#ffbf9d; }
  #caption { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:5px 10px; font-size:11px;
             background:#101218; border-top:1px solid #3a1520; color:#ffd25c; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  #toast { position:fixed; right:8px; top:34px; max-width:75%; background:#12141a; border:1px solid var(--r);
           border-left:4px solid var(--r); padding:6px 9px; font-size:10px; opacity:0; transition:opacity .4s; z-index:9; }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">BADCLAUDIO</span>
  <span><span class="dot" id="dot"></span><span id="statusTxt">…</span></span>
  <span id="keysTxt"></span>
</div>
<div id="world"><canvas id="cv"></canvas></div>
<div id="roster"></div>
<div id="caption">office live</div>
<div id="toast"></div>
<script>
// =====================================================================
//  AGENT ROOM — base de sprites propria (agents_2d + office_decor_clean)
//  Folhas de personagem: 96x128 = 4 quadros (col) x 4 direcoes (linha)
//  de 24x32. Direcoes: 0=baixo 1=esquerda 2=direita 3=cima.
// =====================================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const LW = 270, LH = 500;                     // cena logica
let scale = 1, offX = 0, offY = 0;
function resize() {
  const w = window.innerWidth, h = window.innerHeight - 90;
  cv.width = w; cv.height = h;
  scale = Math.min(w / LW, h / LH);
  offX = (w - LW * scale) / 2; offY = (h - LH * scale) / 2;
}
window.addEventListener('resize', resize); resize();

const FRAME_W = 24, FRAME_H = 32;
const DIR = { DOWN: 0, LEFT: 1, RIGHT: 2, UP: 3 };

// ---------------- carregamento ----------------
const IMG = {};
function load(name) {
  const i = new Image();
  i.src = 'assets/' + name;
  IMG[name] = i;
  return i;
}
const SPRITES = {
  dev_station: 'office_dev_station.png',
  rack: 'office_server_rack.png',
  sofa: 'office_leather_sofa.png',
  cooler: 'office_water_cooler.png',
  plant: 'office_plant_ficus.png',
  chair: 'office_chair_executive.png',
  floor: 'floor_wood_noble.png',
  window: 'wall_north_window.png',
  wall: 'wall_texture_limezu.png'
};
Object.values(SPRITES).forEach(load);
const SHEETS = {
  Diretor:   load('director_executive.png'),
  'Dev Sr':  load('godot_senior_dev.png'),
  Pesquisa:  load('ai_researcher.png'),
  QA:        load('qa_auditor.png'),
  Infra:     load('infra_devops.png'),
  Arte:      load('concept_artist.png')
};

// ---------------- layout ----------------
// 3 colunas de estacoes encostadas na parede + area de caminhada livre
const ST_W = 78, ST_H = 60;
const DESKS = [];
const COLS = [6, 96, 186];
[[6, 96, 186], [16, 106, 196]].forEach((rowX, r) => {
  rowX.forEach((x, c) => DESKS.push({ x, y: 40 + r * 58, w: ST_W, h: ST_H }));
});
const RACK = { x: 220, y: 168, w: 54, h: 94 };
const SOFA = { x: 20, y: 270, w: 66, h: 44 };
const COOLER = { x: 232, y: 274, w: 26, h: 40 };
const PLANT1 = { x: 6, y: 190, w: 20, h: 34 };
const PLANT2 = { x: 244, y: 330, w: 20, h: 34 };
const CHESS = { x: 95, y: 320, w: 84, h: 84 };
const DOOR = { x: 118, y: 2, w: 34, h: 22 };

// colisao (AABBs)
const OBSTACLES = [RACK, SOFA, COOLER, PLANT1, PLANT2, CHESS,
  ...DESKS.map(d => ({ x: d.x, y: d.y, w: d.w, h: d.h }))];
const AR = 7;
function collide(a) {
  for (const o of OBSTACLES) {
    const nx = Math.max(o.x, Math.min(a.px, o.x + o.w));
    const ny = Math.max(o.y, Math.min(a.py, o.y + o.h));
    const dx = a.px - nx, dy = a.py - ny, d2 = dx*dx + dy*dy;
    if (d2 < AR*AR) {
      if (d2 > 0.01) { const d = Math.sqrt(d2); a.px = nx + dx/d*AR; a.py = ny + dy/d*AR; }
      else {
        const l = a.px - o.x, r = o.x + o.w - a.px, t = a.py - o.y, b = o.y + o.h - a.py;
        const m = Math.min(l, r, t, b);
        if (m === l) a.px = o.x - AR; else if (m === r) a.px = o.x + o.w + AR;
        else if (m === t) a.py = o.y - AR; else a.py = o.y + o.h + AR;
      }
    }
  }
  a.px = Math.max(10, Math.min(LW - 10, a.px));
  a.py = Math.max(26, Math.min(LH - 8, a.py));
}
function separate(list) {
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const A = list[i], B = list[j];
    const dx = B.px - A.px, dy = B.py - A.py, d = Math.hypot(dx, dy);
    if (d > 0.01 && d < AR * 2) {
      const p = (AR * 2 - d) / 2;
      A.px -= dx/d*p; A.py -= dy/d*p; B.px += dx/d*p; B.py += dy/d*p;
    }
  }
}

// ---------------- ponte ----------------
let room = { online:false, keys:0, models:0, requests:0, lastServed:null };
let lastReq = -1, taskQueue = [];
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 4000);
}
function caption(m) { document.getElementById('caption').textContent = m; }
async function poll() {
  try { room = await (await fetch('/api/room-status')).json(); }
  catch { room = { online:false, keys:0, models:0, requests:0, lastServed:null }; }
  document.getElementById('dot').className = 'dot' + (room.online ? ' on' : '');
  document.getElementById('statusTxt').textContent = room.online ? 'bridge ONLINE' : 'bridge offline';
  document.getElementById('keysTxt').textContent = room.online ? room.keys + ' canais • ' + (room.requests||0) + ' reqs' : '';
  if (lastReq >= 0 && room.requests > lastReq) {
    for (let k = 0; k < Math.min(room.requests - lastReq, 2); k++) taskQueue.push({ info: room.lastServed });
    toast('⚡ requisição na bridge');
  }
  lastReq = room.requests || 0;
  if (room.online && !poll.was) toast('🥹 ponte ligada: ' + room.keys + ' canais');
  poll.was = room.online;
}
poll.was = false; poll(); setInterval(poll, 4000);

let lastChatter = 0;
async function agentChatter(agent, context) {
  const now = Date.now();
  if (now - lastChatter < 12000) return null;
  lastChatter = now;
  try {
    const r = await fetch('/api/agent-chatter', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ agent, context }), signal: AbortSignal.timeout(7000)
    });
    if (!r.ok) return null;
    return (await r.json()).line || null;
  } catch { return null; }
}

// ---------------- agentes ----------------
const DESK_OF = {};
const AGENTS = ['Diretor', 'Dev Sr', 'Pesquisa', 'QA', 'Infra', 'Arte'].map((name, i) => {
  const d = DESKS[i];
  const a = {
    name, idx: i, desk: d,
    px: d.x + d.w/2, py: d.y + d.h + 12,
    tx: 0, ty: 0, dir: DIR.DOWN, frame: 0, animT: 0, f: 0,
    state: 'WORK', stateT: 0, energy: 55 + Math.random()*45, mood: 70,
    bubble: null, bubbleUntil: 0, next: 3000 + Math.random()*9000,
    outDest: null, outUntil: 0, highlight: 0
  };
  DESK_OF[name] = d;
  return a;
});
const byName = n => AGENTS.find(a => a.name === n);

const OUT_DESTS = [
  'deploy em produção', 'manutenção do Canal #7', 'buscar tokens extras',
  'reunião com o provedor', 'auditar a cascata', 'resolver latência do roteador',
  'backup do gabinete', 'revisar logs da bridge'
];
function say(a, text, dur) { a.bubble = text; a.bubbleUntil = performance.now() + (dur || 4000); }
function goTo(a, x, y, state) { a.tx = x; a.ty = y; a.state = state; a.stateT = 0; }
function arrived(a) { return Math.hypot(a.tx - a.px, a.ty - a.py) < 2.5; }
function backToDesk(a) { goTo(a, a.desk.x + a.desk.w/2, a.desk.y + a.desk.h + 12, 'TO_WORK'); }

let chessPlayers = [];
function brain(a, t) {
  a.stateT += 16;
  switch (a.state) {
    case 'TO_WORK':
      if (arrived(a)) { a.state = 'WORK'; }
      break;
    case 'WORK':
      a.energy -= 0.018;
      if (a.energy < 28) {
        say(a, '☕ energia baixa, indo buscar café');
        agentChatter(a.name, 'pediu uma pausa de café').then(l => l && say(a, l, 5000));
        goTo(a, COOLER.x + COOLER.w/2, COOLER.y + COOLER.h + 14, 'TO_COFFEE');
        caption('☕ @' + a.name + ' pediu café (energia ' + a.energy.toFixed(0) + '%)');
      } else if (t > a.next) {
        a.next = t + 9000 + Math.random()*10000;
        const r = Math.random();
        if (r < 0.35) {
          a.outDest = OUT_DESTS[(Math.random()*OUT_DESTS.length)|0];
          say(a, '🚪 saí: ' + a.outDest, 5000);
          caption('🚪 @' + a.name + ' saiu → ' + a.outDest + ' (via bridge)');
          goTo(a, DOOR.x + DOOR.w/2, DOOR.y + 26, 'TO_DOOR');
        } else if (r < 0.65) {
          say(a, '♟ pausa de xadrez');
          goTo(a, CHESS.x + (a.name.length % 2 ? 6 : CHESS.w - 6), CHESS.y + CHESS.h + 14, 'TO_CHESS');
        } else {
          say(a, '🛋 descanso rápido');
          goTo(a, SOFA.x + SOFA.w/2, SOFA.y + SOFA.h + 14, 'TO_REST');
          agentChatter(a.name, 'foi descansar no sofa').then(l => l && say(a, l, 5000));
        }
      }
      break;
    case 'TO_COFFEE': if (arrived(a)) { a.state = 'COFFEE'; a.stateT = 0; } break;
    case 'COFFEE':
      if (a.stateT > 2600) { a.energy = Math.min(100, a.energy + 35); say(a, '☕ recarregado!'); backToDesk(a); }
      break;
    case 'TO_REST': if (arrived(a)) { a.state = 'REST'; a.stateT = 0; } break;
    case 'REST':
      a.mood = Math.min(100, a.mood + 0.06);
      if (a.stateT > 7000) backToDesk(a);
      break;
    case 'TO_CHESS':
      if (arrived(a)) { a.state = 'CHESS'; a.stateT = 0; if (!chessPlayers.includes(a)) chessPlayers.push(a); }
      break;
    case 'CHESS':
      a.mood = Math.min(100, a.mood + 0.08);
      if (a.stateT > 10000) { chessPlayers = chessPlayers.filter(p => p !== a); backToDesk(a); }
      break;
    case 'PROCESS':
      if (a.stateT > 3200) { say(a, '✔ requisição processada'); backToDesk(a); }
      break;
    case 'TO_DOOR': if (arrived(a)) { a.state = 'OUT'; a.outUntil = t + 6000 + Math.random()*8000; } break;
    case 'OUT':
      if (t > a.outUntil) {
        a.px = DOOR.x + DOOR.w/2; a.py = DOOR.y + 26;
        say(a, '↩ voltei: ' + a.outDest + ' concluído', 4500);
        caption('↩ @' + a.name + ' voltou de: ' + a.outDest);
        a.outDest = null;
        backToDesk(a);
      }
      break;
  }
}
function dispatchTasks() {
  while (taskQueue.length) {
    const task = taskQueue.shift();
    const free = AGENTS.filter(a => a.state === 'WORK');
    if (!free.length) { taskQueue.unshift(task); return; }
    const a = free[(Math.random()*free.length)|0];
    const info = task.info || 'requisição';
    say(a, '🌉 processando: ' + info, 4600);
    caption('🌉 @' + a.name + ' processou ' + info);
    goTo(a, RACK.x + RACK.w + 16, RACK.y + 46, 'PROCESS');
  }
}

// ---------------- xadrez ----------------
const PIECES = [];
(function () {
  const back = ['t','h','b','q','k','b','h','t'];
  for (let i = 0; i < 8; i++) {
    PIECES.push({ c:0, t:'p', x:i, y:1 }, { c:1, t:'p', x:i, y:6 });
    PIECES.push({ c:0, t:back[i], x:i, y:0 }, { c:1, t:back[i], x:i, y:7 });
  }
})();
let chessAnim = null, chessLast = 0;
function chessStep(t) {
  if (t - chessLast < 4800 || !chessPlayers.length) return;
  chessLast = t;
  const side = Math.random() < 0.5 ? 0 : 1;
  const mine = PIECES.filter(p => p.c === side);
  if (!mine.length) return;
  const p = mine[(Math.random()*mine.length)|0];
  const nx = Math.max(0, Math.min(7, p.x + [-1,0,1][(Math.random()*3)|0]));
  const ny = Math.max(0, Math.min(7, p.y + (side === 0 ? 1 : -1)));
  const v = PIECES.findIndex(o => o !== p && o.x === nx && o.y === ny);
  if (v >= 0) PIECES.splice(v, 1);
  chessAnim = { p, fx: p.x, fy: p.y, start: t };
  p.x = nx; p.y = ny;
  if (Math.random() < 0.4) say(chessPlayers[(Math.random()*chessPlayers.length)|0], '♟ xeque!');
}

// ---------------- desenho: cenario ----------------
function tile(img, tw, th, y0) {
  if (!img.complete || !img.naturalWidth) return false;
  for (let y = y0; y < LH; y += th)
    for (let x = 0; x < LW; x += tw)
      ctx.drawImage(img, x, y, tw, th);
  return true;
}
function drawRoom(t) {
  ctx.fillStyle = '#12141c'; ctx.fillRect(0, 0, LW, LH);
  // piso de madeira (64x64)
  tile(IMG[SPRITES.floor], 64, 64, 92);
  // parede: textura + janelas
  const wall = IMG[SPRITES.wall];
  if (wall.complete && wall.naturalWidth) {
    for (let x = 0; x < LW; x += 64) ctx.drawImage(wall, x, 0, 64, 92);
  } else { ctx.fillStyle = '#2b3340'; ctx.fillRect(0, 0, LW, 92); }
  const win = IMG[SPRITES.window];
  if (win.complete && win.naturalWidth) {
    for (let x = 14; x < LW - 80; x += 104) ctx.drawImage(win, x, 8, 64, 32);
  }
  // faixa neon de status
  ctx.fillStyle = room.online ? '#ff164f' : '#3a1520';
  ctx.fillRect(0, 88, LW, 2);
  // porta
  ctx.fillStyle = '#3a2415'; ctx.fillRect(DOOR.x - 3, 2, DOOR.w + 6, 24);
  ctx.fillStyle = '#57351d'; ctx.fillRect(DOOR.x, 5, DOOR.w, 20);
  ctx.fillStyle = '#ffcf5c'; ctx.fillRect(DOOR.x + DOOR.w - 5, 14, 2, 2);
  ctx.fillStyle = '#ffd25c'; ctx.font = 'bold 7px Consolas'; ctx.textAlign = 'center';
  ctx.fillText('SAÍDA →', DOOR.x + DOOR.w/2, 34);
  ctx.textAlign = 'left';
}
function drawMob() {
  const rack = IMG[SPRITES.rack];
  if (rack.complete && rack.naturalWidth) ctx.drawImage(rack, RACK.x, RACK.y, RACK.w, RACK.h);
  if (room.online) for (let u = 0; u < 5; u++) {
    const y = RACK.y + 14 + u * 14;
    ctx.fillStyle = ((performance.now()*0.004 + u) % 3) > 0.6 ? '#66ff75' : '#2f7a43';
    ctx.fillRect(RACK.x + 8, y, 2, 2);
    ctx.fillRect(RACK.x + 13, y, 2, 2);
  }
  const sofa = IMG[SPRITES.sofa];
  if (sofa.complete && sofa.naturalWidth) ctx.drawImage(sofa, SOFA.x, SOFA.y, SOFA.w, SOFA.h);
  const cooler = IMG[SPRITES.cooler];
  if (cooler.complete && cooler.naturalWidth) ctx.drawImage(cooler, COOLER.x, COOLER.y, COOLER.w, COOLER.h);
  const plant = IMG[SPRITES.plant];
  if (plant.complete && plant.naturalWidth) {
    ctx.drawImage(plant, PLANT1.x, PLANT1.y, PLANT1.w, PLANT1.h);
    ctx.drawImage(plant, PLANT2.x, PLANT2.y, PLANT2.w, PLANT2.h);
  }
  // estacoes + quem esta sentado
  const st = IMG[SPRITES.dev_station];
  DESKS.forEach((d, i) => {
    const a = AGENTS[i];
    const seated = a && (a.state === 'WORK' || a.state === 'TO_WORK');
    if (seated) {
      drawChar(a, d.x + d.w/2 - FRAME_W/2, d.y + 8, DIR.DOWN, 0, 1);
      if (st.complete && st.naturalWidth) ctx.drawImage(st, d.x, d.y, d.w, d.h);
    } else {
      if (st.complete && st.naturalWidth) ctx.drawImage(st, d.x, d.y, d.w, d.h);
      const ch = IMG[SPRITES.chair];
      if (ch.complete && ch.naturalWidth) ctx.drawImage(ch, d.x + d.w/2 - 9, d.y + d.h - 12, 18, 22);
    }
  });
  // mesa de xadrez (desenhada, com pecas da base nao existentes)
  drawChessTable();
}
function drawChessTable() {
  const { x, y, w, h } = CHESS, cell = 10;
  ctx.globalAlpha = .35; ctx.fillStyle = '#000'; ctx.fillRect(x + 3, y + h - 6, w, 6); ctx.globalAlpha = 1;
  ctx.fillStyle = '#452b16'; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  ctx.fillStyle = '#6b4425'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#cfcfc4' : '#4c4a42';
    ctx.fillRect(x + c*cell, y + r*cell, cell, cell);
  }
  PIECES.forEach(p => {
    let X = x + p.x*cell + 1, Y = y + p.y*cell + 1;
    if (chessAnim && chessAnim.p === p) {
      const k = Math.min(1, (performance.now() - chessAnim.start) / 420);
      X = x + (chessAnim.fx + (p.x - chessAnim.fx)*k)*cell + 1;
      Y = y + (chessAnim.fy + (p.y - chessAnim.fy)*k)*cell + 1 - Math.sin(k*Math.PI)*6;
      if (k >= 1) chessAnim = null;
    }
    const col = p.c === 0 ? '#f4f4ee' : '#1c1c26';
    const hh = p.t === 'p' ? 5 : (p.t === 'k' || p.t === 'q') ? 8 : 7;
    ctx.fillStyle = col; ctx.fillRect(X, Y + (8 - hh), 7, hh);
    ctx.fillStyle = p.c === 0 ? '#b8b8a8' : '#08080d';
    ctx.fillRect(X, Y + 7, 7, 1);
  });
}
// desenha um quadro da folha 96x128 (24x32)
function drawChar(a, x, y, dir, frame, alpha) {
  const sheet = SHEETS[a.name];
  if (!sheet || !sheet.complete || !sheet.naturalWidth) return;
  const sx = (frame % 4) * FRAME_W, sy = (dir % 4) * FRAME_H;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.drawImage(sheet, sx, sy, FRAME_W, FRAME_H, x|0, y|0, FRAME_W, FRAME_H);
  ctx.globalAlpha = 1;
}
function drawAgent(a, t) {
  if (a.state === 'OUT') return;
  // sombra
  ctx.globalAlpha = .35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(a.px, a.py + 2, 8, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  const moving = a.state.startsWith('TO_');
  const frame = moving ? (a.frame | 0) % 4 : 0;
  drawChar(a, a.px - FRAME_W/2, a.py - FRAME_H + 4, a.dir, frame);
  // destaque
  if (a.highlight > t - 2000) {
    ctx.strokeStyle = '#ffcf5c'; ctx.globalAlpha = Math.max(0, 1 - (t - a.highlight)/2000);
    ctx.beginPath(); ctx.ellipse(a.px, a.py - 14, 12, 20, 0, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // nome
  ctx.font = 'bold 7px Consolas'; ctx.textAlign = 'center';
  const w = a.name.length * 5 + 6;
  ctx.fillStyle = 'rgba(8,9,12,.72)'; ctx.fillRect(a.px - w/2, a.py + 4, w, 9);
  ctx.fillStyle = '#9ff'; ctx.fillText(a.name, a.px, a.py + 5);
  ctx.textAlign = 'left';
  // balao
  if (a.bubble && t < a.bubbleUntil) {
    const txt = a.bubble.length > 28 ? a.bubble.slice(0, 27) + '…' : a.bubble;
    const bw = Math.min(250, 10 + txt.length * 5), bh = 16;
    const bx = Math.max(4, Math.min(LW - bw - 4, a.px - bw/2)), by = a.py - FRAME_H - 14;
    ctx.globalAlpha = .95; ctx.fillStyle = '#f4f4ee';
    ctx.fillRect(bx, by, bw, bh); ctx.fillRect(a.px - 3, by + bh, 6, 4);
    ctx.font = '8px Consolas'; ctx.fillStyle = '#1a1c24';
    ctx.fillText(txt, bx + 5, by + 5);
    ctx.globalAlpha = 1;
  }
}
function drawRoster() {
  document.getElementById('roster').innerHTML = AGENTS.map(a => {
    const cls = a.state === 'OUT' ? 'out' : '';
    const label = a.state === 'OUT'
      ? `${a.name} 🚪→ ${a.outDest || 'fora'}`
      : `${a.name} ${({WORK:'💻',TO_WORK:'💻',COFFEE:'☕',TO_COFFEE:'☕',REST:'🛋',TO_REST:'🛋',CHESS:'♟',TO_CHESS:'♟',PROCESS:'🌉',TO_DOOR:'🚪',OUT:'🚪'})[a.state] || '🚶'} ${a.energy.toFixed(0)}%`;
    return `<div class="chip ${cls}">${label}</div>`;
  }).join('');
}

// ---------------- loop ----------------
function render(t) {
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.imageSmoothingEnabled = false;

  drawRoom(t);
  drawMob();

  const vis = AGENTS.filter(a => a.state !== 'OUT');
  vis.forEach(a => {
    if (a.state.startsWith('TO_')) {
      const dx = a.tx - a.px, dy = a.ty - a.py, d = Math.hypot(dx, dy);
      if (d > 2) {
        a.px += dx/d * 0.75; a.py += dy/d * 0.75;
        a.f += 0.14;
        a.frame = (a.frame + 0.10) % 4;
        a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
      }
    }
  });
  vis.forEach(collide);
  separate(vis);
  AGENTS.forEach(a => brain(a, t));
  dispatchTasks();
  chessStep(t);

  // desenha por profundidade (y) — quem esta mais em cima primeiro
  [...vis].sort((a, b) => a.py - b.py).forEach(a => drawAgent(a, t));

  // vinheta
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, 'rgba(0,0,0,.30)'); g.addColorStop(.2, 'transparent');
  g.addColorStop(.85, 'transparent'); g.addColorStop(1, 'rgba(0,0,0,.40)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  ctx.restore();

  drawRoster();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
