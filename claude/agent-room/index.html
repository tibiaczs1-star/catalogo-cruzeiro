<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BadClaudio — Agent Room</title>
<link rel="icon" href="/claudio.ico">
<style>
  :root { --r:#ff164f; --ok:#66ff75; --bg:#0a0c10; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); font:12px/1.35 Consolas,monospace; overflow:hidden; color:#e8e8ee; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; gap:8px; align-items:center;
         padding:5px 10px; background:#101218; border-bottom:1px solid #3a1520; font-size:11px; }
  #bar .brand { color:var(--r); font-weight:900; letter-spacing:1px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:#555; vertical-align:middle; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #keysTxt { color:#9aa; }
  #world { position:absolute; inset:26px 0 64px 0; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  #roster { position:fixed; left:0; right:0; bottom:22px; z-index:5; display:flex; gap:5px; padding:4px 8px;
            overflow-x:auto; background:#0b0d13; border-top:1px solid #23262e; }
  .chip { flex:0 0 auto; padding:3px 7px; background:#151821; border:1px solid #2a2e3a; border-radius:10px;
          font-size:10px; white-space:nowrap; }
  .chip.out { border-color:#ff8a5c; color:#ffbf9d; }
  #caption { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:5px 10px; font-size:11px;
             background:#101218; border-top:1px solid #3a1520; color:#ffd25c; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  #chatbox { position:fixed; left:6px; right:6px; bottom:44px; z-index:6; display:flex; gap:4px; }
  #chatbox input { flex:1; background:#0d1016; border:1px solid #3a1520; color:#eee; font:11px Consolas;
                   padding:5px 8px; border-radius:4px; min-width:0; }
  #chatbox input:focus { outline:1px solid #ff164f; }
  #chatbox button { background:#ff164f; border:0; color:#fff; font-weight:700; padding:0 12px; border-radius:4px; cursor:pointer; }
  #toast { position:fixed; right:8px; top:34px; max-width:75%; background:#12141a; border:1px solid var(--r);
           border-left:4px solid var(--r); padding:6px 9px; font-size:10px; opacity:0; transition:opacity .4s; z-index:9; }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">BADCLAUDIO</span>
  <span><span class="dot" id="dot"></span><span id="statusTxt">…</span></span>
  <span id="keysTxt"></span>
</div>
<div id="world"><canvas id="cv"></canvas></div>
<div id="roster"></div>
<div id="caption">office live</div>
<div id="toast"></div>
<div id="chatbox">
  <input id="chatIn" placeholder="fale com o escritório…" maxlength="90">
  <button id="chatSend">➤</button>
</div>
<script>
// =====================================================================
//  AGENT ROOM — todos os comportamentos ilustrados
//  Sprites: base 2D propria (agents_2d 4x4 de 24x32, office decor)
//  Ilustrado em codigo: entrega de papel, estudo, refeicao, limpeza,
//  academia, cochilo, jogos (xadrez/damas/sinuca), motoboys subagentes.
// =====================================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const LW = 270, LH = 560;
let scale = 1, offX = 0, offY = 0;
function resize() {
  const w = window.innerWidth, h = window.innerHeight - 90;
  cv.width = w; cv.height = h;
  scale = Math.min(w / LW, h / LH);
  offX = (w - LW * scale) / 2; offY = (h - LH * scale) / 2;
}
window.addEventListener('resize', resize); resize();

const FW = 24, FH = 32;
const DIR = { DOWN: 0, LEFT: 1, RIGHT: 2, UP: 3 };

const IMG = {};
const NAMES = {
  station: 'office_dev_station.png', rack: 'office_server_rack.png',
  sofa: 'office_leather_sofa.png', cooler: 'office_water_cooler.png',
  plant: 'office_plant_ficus.png', chair: 'office_chair_executive.png',
  floor: 'floor_wood_noble.png', window: 'wall_north_window.png', wall: 'wall_texture_limezu.png'
};
const load = n => (IMG[n] = Object.assign(new Image(), { src: 'assets/' + n }));
Object.values(NAMES).forEach(load);
const SHEET = {
  Diretor: load('director_executive.png'), 'Dev Sr': load('godot_senior_dev.png'),
  Pesquisa: load('ai_researcher.png'), QA: load('qa_auditor.png'),
  Infra: load('infra_devops.png'), Arte: load('concept_artist.png')
};

// ---------------- layout ----------------
const DESKS = [];
[[6, 96, 186], [16, 106, 196]].forEach((row, r) => row.forEach(x => DESKS.push({ x, y: 36 + r * 58, w: 78, h: 60 })));
const RACK = { x: 220, y: 156, w: 46, h: 84 };
const SOFA = { x: 16, y: 258, w: 84, h: 56 };
const COOLER = { x: 238, y: 258, w: 22, h: 36 };
const PLANT1 = { x: 4, y: 186, w: 18, h: 30 };
const PLANT2 = { x: 248, y: 316, w: 18, h: 30 };
const POOL = { x: 102, y: 254, w: 90, h: 54 };
const CHESS = { x: 6, y: 340, w: 56, h: 56 };
const DRAUGHT = { x: 68, y: 340, w: 56, h: 56 };
const STUDY_A = { x: 132, y: 336, w: 60, h: 48 };
const STUDY_B = { x: 198, y: 336, w: 60, h: 48 };
const SUBDOOR = { x: 6, y: 432, w: 30, h: 34 };     // portinha dos motoboys subagentes
const LUNCH = { x: 48, y: 426, w: 46, h: 28 };
const GYM = { x: 104, y: 428, w: 38, h: 28 };
const MAT = { x: 152, y: 428, w: 50, h: 24 };
const DIR_OFFICE = { x: 218, y: 500, w: 34, h: 28 };
const RING = { x: 196, y: 424, w: 62, h: 62 };        // ringue de Wing Chun
const DOOR = { x: 118, y: 2, w: 34, h: 24 };

const OBSTACLES = [RACK, SOFA, COOLER, PLANT1, PLANT2, POOL, CHESS, DRAUGHT,
  STUDY_A, STUDY_B, SUBDOOR, LUNCH, GYM, MAT, DIR_OFFICE, RING,
  ...DESKS.map(d => ({ x: d.x, y: d.y, w: d.w, h: d.h }))];
const AR = 7;
function collide(a) {
  for (const o of OBSTACLES) {
    const nx = Math.max(o.x, Math.min(a.px, o.x + o.w));
    const ny = Math.max(o.y, Math.min(a.py, o.y + o.h));
    const dx = a.px - nx, dy = a.py - ny, d2 = dx*dx + dy*dy;
    if (d2 < AR*AR) {
      if (d2 > 0.01) { const d = Math.sqrt(d2); a.px = nx + dx/d*AR; a.py = ny + dy/d*AR; }
      else {
        const l = a.px - o.x, r = o.x + o.w - a.px, t = a.py - o.y, b = o.y + o.h - a.py, m = Math.min(l, r, t, b);
        if (m === l) a.px = o.x - AR; else if (m === r) a.px = o.x + o.w + AR;
        else if (m === t) a.py = o.y - AR; else a.py = o.y + o.h + AR;
      }
    }
  }
  a.px = Math.max(10, Math.min(LW - 10, a.px));
  a.py = Math.max(24, Math.min(LH - 6, a.py));
}
function separate(list) {
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const A = list[i], B = list[j];
    const dx = B.px - A.px, dy = B.py - A.py, d = Math.hypot(dx, dy);
    if (d > 0.01 && d < AR * 2) {
      const p = (AR*2 - d)/2;
      A.px -= dx/d*p; A.py -= dy/d*p; B.px += dx/d*p; B.py += dy/d*p;
    }
  }
}

// ---------------- ponte ----------------
let room = { online:false, keys:0, models:0, requests:0 };
let lastReq = -1, taskQueue = [];
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 4000);
}
function caption(m) { document.getElementById('caption').textContent = m; }
async function poll() {
  try { room = await (await fetch('/api/room-status')).json(); }
  catch { room = { online:false, keys:0, models:0, requests:0 }; }
  document.getElementById('dot').className = 'dot' + (room.online ? ' on' : '');
  document.getElementById('statusTxt').textContent = room.online ? 'bridge ONLINE' : 'bridge offline';
  document.getElementById('keysTxt').textContent = room.online ? room.keys + ' canais • ' + (room.requests||0) + ' reqs' : '';
  if (lastReq >= 0 && room.requests > lastReq) {
    for (let k = 0; k < Math.min(room.requests - lastReq, 2); k++) taskQueue.push(1);
    // requisicao tambem manda um motoboy subagente
    spawnRider();
    toast('⚡ requisição na bridge → motoboy disparado');
  }
  lastReq = room.requests || 0;
  if (room.online && !poll.was) toast('🥹 ponte ligada: ' + room.keys + ' canais');
  poll.was = room.online;
}
poll.was = false; poll(); setInterval(poll, 4000);

let lastChatter = 0;
async function agentChatter(agent, context) {
  const now = Date.now();
  if (now - lastChatter < 12000) return null;
  lastChatter = now;
  try {
    const r = await fetch('/api/agent-chatter', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ agent, context }), signal: AbortSignal.timeout(7000) });
    return r.ok ? ((await r.json()).line || null) : null;
  } catch { return null; }
}

// ---------------- agentes ----------------
const AGENTS = ['Diretor', 'Dev Sr', 'Pesquisa', 'QA', 'Infra', 'Arte'].map((name, i) => {
  const d = DESKS[i];
  return { name, idx: i, desk: d, px: d.x + d.w/2, py: d.y + d.h + 12, tx: 0, ty: 0,
    dir: DIR.DOWN, frame: 0, f: 0, state: 'WORK', stateT: 0,
    energy: 55 + Math.random()*45, mood: 70, bubble: null, bubbleUntil: 0,
    next: 3000 + Math.random()*9000, outDest: null, outUntil: 0, carrying: false, target: null,
    emotion: '😐', emotionUntil: 0, argues: 0, training: false };
});
const who = n => AGENTS.find(a => a.name === n);
const DIRETOR = who('Diretor');

const OUT_DESTS = ['deploy em produção', 'manutenção do Canal #7', 'buscar tokens extras',
  'reunião com o provedor', 'auditar a cascata', 'resolver latência do roteador',
  'backup do gabinete', 'revisar logs da bridge'];
function say(a, text, dur) { a.bubble = text; a.bubbleUntil = performance.now() + (dur || 4000); }
function goTo(a, x, y, state, target) { a.tx = x; a.ty = y; a.state = state; a.stateT = 0; a.target = target || null; }
function arrived(a) { return Math.hypot(a.tx - a.px, a.ty - a.py) < 2.5; }
function backToDesk(a) { a.target = null; goTo(a, a.desk.x + a.desk.w/2, a.desk.y + a.desk.h + 12, 'TO_WORK'); }

const SEATS = [{ x: SOFA.x + 22, y: SOFA.y + 40 }, { x: SOFA.x + 60, y: SOFA.y + 40 }];
const SEAT_TAKEN = {};
const STUDY_SEATS = [
  { x: STUDY_A.x + STUDY_A.w/2, y: STUDY_A.y + STUDY_A.h + 12, name: 'A' },
  { x: STUDY_B.x + STUDY_B.w/2, y: STUDY_B.y + STUDY_B.h + 12, name: 'B' }
];
const STUDY_TAKEN = {};
let chessPlayers = [], damaPlayers = [], poolPlayers = [];
let dust = [];  // manchas para limpar

function startDelivery(a) {
  a.carrying = true;
  say(a, '📄 terminei! levando pro Diretor');
  caption('📄 @' + a.name + ' terminou a tarefa e vai entregar o relatório ao Diretor');
  goTo(a, DIR_OFFICE.x - 16, DIR_OFFICE.y + 14, 'TO_BOSS');
}
function pickActivity(a, t) {
  const r = Math.random();
  if (r < 0.20) startDelivery(a);
  else if (r < 0.30) {
    const seat = SEATS.find((s, i) => !SEAT_TAKEN['s'+i]);
    if (seat) { SEAT_TAKEN['s' + SEATS.indexOf(seat)] = a.name; goTo(a, seat.x, seat.y, 'TO_SOFA'); say(a, '🛋 descanso'); }
    else startDelivery(a);
  }
  else if (r < 0.38) {
    const st = STUDY_SEATS.find((s, i) => !STUDY_TAKEN['t'+i]);
    if (st) { STUDY_TAKEN['t' + STUDY_SEATS.indexOf(st)] = a.name; goTo(a, st.x, st.y, 'TO_STUDY'); say(a, '📚 estudando'); agentChatter(a.name, 'foi estudar').then(l => l && say(a, l, 5000)); }
    else startDelivery(a);
  }
  else if (r < 0.46) { say(a, '🍽 almoço'); goTo(a, LUNCH.x + LUNCH.w/2, LUNCH.y + LUNCH.h + 12, 'TO_EAT'); }
  else if (r < 0.53) { say(a, '💪 treino rápido'); goTo(a, GYM.x + GYM.w/2, GYM.y + GYM.h + 10, 'TO_GYM'); }
  else if (r < 0.60) { say(a, '😴 cochilo'); goTo(a, MAT.x + MAT.w/2, MAT.y + MAT.h + 10, 'TO_NAP'); }
  else if (r < 0.68 && dust.length) {
    const d = dust[(Math.random()*dust.length)|0];
    say(a, '🧹 limpando');
    goTo(a, d.x, d.y + 10, 'TO_CLEAN', d);
    caption('🧹 @' + a.name + ' foi limpar o escritório');
  }
  else if (r < 0.74) {
    say(a, '🚪 saí: ' + (a.outDest = OUT_DESTS[(Math.random()*OUT_DESTS.length)|0]), 5000);
    caption('🚪 @' + a.name + ' saiu → ' + a.outDest + ' (via bridge)');
    goTo(a, DOOR.x + DOOR.w/2, DOOR.y + 28, 'TO_DOOR');
  }
  else if (r < 0.82) { say(a, '♟ xadrez'); goTo(a, CHESS.x + (a.idx % 2 ? 6 : CHESS.w - 6), CHESS.y + CHESS.h + 10, 'TO_CHESS'); }
  else if (r < 0.86) { say(a, '⚪ damas'); goTo(a, DRAUGHT.x + (a.idx % 2 ? 6 : DRAUGHT.w - 6), DRAUGHT.y + DRAUGHT.h + 10, 'TO_DRAUGHT'); }
  else if (r < 0.90) { say(a, '🎱 sinuca'); goTo(a, POOL.x + (a.idx % 2 ? 4 : POOL.w - 4), POOL.y + POOL.h + 10, 'TO_POOL'); }
  else if (r < 0.95) {
    say(a, '🥋 treino de Wing Chun');
    goTo(a, RING.x + (a.idx % 2 ? 8 : RING.w - 8), RING.y + RING.h + 10, 'TO_WINGCHUN');
    caption('🥋 @' + a.name + ' foi para o ringue treinar Wing Chun');
  }
  else if (r < 0.99) { startArgument(a); }
  else { say(a, '🗣 batendo um papo'); goTo(a, 60 + Math.random()*130, 236 + Math.random()*24, 'TO_CHAT'); agentChatter(a.name, 'parou para conversar').then(l => l && say(a, l, 5000)); }
}
function releaseSeats(a) {
  SEATS.forEach((s, i) => { if (SEAT_TAKEN['s'+i] === a.name) delete SEAT_TAKEN['s'+i]; });
  STUDY_SEATS.forEach((s, i) => { if (STUDY_TAKEN['t'+i] === a.name) delete STUDY_TAKEN['t'+i]; });
  chessPlayers = chessPlayers.filter(p => p !== a);
  damaPlayers = damaPlayers.filter(p => p !== a);
  poolPlayers = poolPlayers.filter(p => p !== a);
}
function brain(a, t) {
  a.stateT += 16;
  switch (a.state) {
    case 'WORK':
      a.energy -= 0.018;
      if (a.energy < 26) {
        say(a, '💧 energia baixa, indo beber água');
        agentChatter(a.name, 'foi buscar agua').then(l => l && say(a, l, 5000));
        goTo(a, COOLER.x + COOLER.w/2, COOLER.y + COOLER.h + 12, 'TO_COOLER');
        caption('💧 @' + a.name + ' foi beber água (energia ' + a.energy.toFixed(0) + '%)');
      } else if (t > a.next) { a.next = t + 10000 + Math.random()*10000; pickActivity(a, t); }
      break;
    case 'TO_COOLER': if (arrived(a)) { a.state = 'COOLER'; a.stateT = 0; } break;
    case 'COOLER': if (a.stateT > 2400) { a.energy = Math.min(100, a.energy + 35); say(a, '💧 recarregado!'); backToDesk(a); } break;
    case 'TO_SOFA': if (arrived(a)) { a.state = 'SOFA'; a.stateT = 0; } break;
    case 'SOFA': a.mood = Math.min(100, a.mood + .06); if (a.stateT > 8000) { releaseSeats(a); backToDesk(a); } break;
    case 'TO_STUDY': if (arrived(a)) { a.state = 'STUDY'; a.stateT = 0; } break;
    case 'STUDY': a.mood = Math.min(100, a.mood + .03); if (a.stateT > 9000) { releaseSeats(a); backToDesk(a); } break;
    case 'TO_EAT': if (arrived(a)) { a.state = 'EAT'; a.stateT = 0; } break;
    case 'EAT': if (a.stateT > 5000) { a.energy = Math.min(100, a.energy + 25); say(a, '🍽 alimentado!'); backToDesk(a); } break;
    case 'TO_GYM': if (arrived(a)) { a.state = 'GYM'; a.stateT = 0; } break;
    case 'GYM': if (a.stateT > 5000) { a.mood = Math.min(100, a.mood + 12); a.energy = Math.max(0, a.energy - 8); say(a, '💪 treino feito!'); backToDesk(a); } break;
    case 'TO_NAP': if (arrived(a)) { a.state = 'NAP'; a.stateT = 0; } break;
    case 'NAP': if (a.stateT > 9000) { a.energy = Math.min(100, a.energy + 30); a.mood += 8; say(a, '😴 revigorado'); backToDesk(a); } break;
    case 'TO_CLEAN': if (arrived(a)) { a.state = 'CLEAN'; a.stateT = 0; } break;
    case 'CLEAN':
      if (a.stateT > 3000) {
        if (a.target) { dust = dust.filter(d => d !== a.target); a.target = null; }
        say(a, '✨ limpo!'); backToDesk(a);
      }
      break;
    case 'TO_CHESS': if (arrived(a)) { a.state = 'CHESS'; a.stateT = 0; if (!chessPlayers.includes(a)) chessPlayers.push(a); } break;
    case 'CHESS': if (a.stateT > 10000) { releaseSeats(a); backToDesk(a); } break;
    case 'TO_DRAUGHT': if (arrived(a)) { a.state = 'DRAUGHT'; a.stateT = 0; if (!damaPlayers.includes(a)) damaPlayers.push(a); } break;
    case 'DRAUGHT': if (a.stateT > 10000) { releaseSeats(a); backToDesk(a); } break;
    case 'TO_POOL': if (arrived(a)) { a.state = 'POOL'; a.stateT = 0; if (!poolPlayers.includes(a)) poolPlayers.push(a); } break;
    case 'POOL': if (a.stateT > 12000) { releaseSeats(a); backToDesk(a); } break;
    case 'TO_CHAT': if (a.stateT > 6000) backToDesk(a); break;
    case 'TO_WINGCHUN':
      if (arrived(a)) { a.state = 'WINGCHUN'; a.stateT = 0; say(a, '🥋 siu nim tao...'); }
      break;
    case 'WINGCHUN':
      a.mood = Math.min(100, a.mood + .05);
      if (a.stateT > 9000) { say(a, '🥋 treino concluído, foco total'); setEmotion(a, '😌'); backToDesk(a); }
      break;
    case 'TO_ARGUE': if (arrived(a)) { a.state = 'ARGUE'; a.stateT = 0; } break;
    case 'ARGUE':
      if (a.stateT > 9000) { releaseSeats(a); a.argues = 0; setEmotion(a, '😤'); backToDesk(a); }
      break;
    case 'TO_BOSS': if (arrived(a)) { a.state = 'HANDOFF'; a.stateT = 0; } break;
    case 'HANDOFF':
      if (a.stateT > 1500 && a.carrying) {
        a.carrying = false;
        say(a, '📄 entregue!', 3000);
        say(DIRETOR, '📥 recebido, bom trabalho', 4500);
        DIRETOR.mood = Math.min(100, DIRETOR.mood + 5);
        DIRETOR.energy = Math.min(100, DIRETOR.energy + 4);
        caption('🤝 @' + a.name + ' entregou o relatório pessoalmente ao Diretor');
      }
      if (a.stateT > 4200) backToDesk(a);
      break;
    case 'PROCESS': if (a.stateT > 3200) { say(a, '✔ requisição processada'); backToDesk(a); } break;
    case 'TO_DOOR': if (arrived(a)) { a.state = 'OUT'; a.outUntil = t + 6000 + Math.random()*8000; } break;
    case 'OUT':
      if (t > a.outUntil) {
        a.px = DOOR.x + DOOR.w/2; a.py = DOOR.y + 28;
        say(a, '↩ voltei: ' + a.outDest + ' concluído', 4500);
        caption('↩ @' + a.name + ' voltou de: ' + a.outDest);
        a.outDest = null; backToDesk(a);
      }
      break;
  }
}
// emocoes visiveis (minimas, mas legiveis)
function setEmotion(a, e, dur) { a.emotion = e; a.emotionUntil = performance.now() + (dur || 6000); }
// discordia interna: dois agentes discordam sobre uma decisao tecnica e a IA da bridge gera as falas
const ARGUE_TOPICS = [
  'tabs ou espacos no projeto', 'monolito ou microsservicos', 'Python ou TypeScript no backend',
  'testar tudo ou so o caminho critico', 'cache agressivo ou dados sempre frescos',
  'deploy na sexta ou esperar segunda', 'REST ou GraphQL', 'escrever doc ou codar mais rapido'
];
let arguing = new Set();
function startArgument(a) {
  const other = AGENTS.find(g => g !== a && g.state === 'WORK' && !arguing.has(g.name));
  if (!other) { say(a, '🗣 papo rápido'); goTo(a, 60 + Math.random()*130, 236 + Math.random()*24, 'TO_CHAT'); return; }
  const topic = ARGUE_TOPICS[(Math.random() * ARGUE_TOPICS.length) | 0];
  arguing.add(a.name); arguing.add(other.name);
  const mx = 150, my = 232;
  goTo(a, mx - 12, my, 'TO_ARGUE');
  goTo(other, mx + 12, my, 'TO_ARGUE');
  say(a, '😤 ' + topic + ': discordo!', 7000);
  setEmotion(a, '😠'); setEmotion(other, '😤');
  caption('🗯️ @' + a.name + ' e @' + other.name + ' estão discordando sobre ' + topic);
  // fala real dos dois lados via IA da bridge
  agentChatter(a.name, 'discorda do colega sobre ' + topic + ', defenda seu lado em 8 palavras')

  const { x, y, w } = CHESS, cell = w / 8;
  board(x, y, w, cell);
  PIECES.forEach(p => {
    let X = x + p.x*cell + .5, Y = y + p.y*cell + .5;
    if (chessAnim && chessAnim.p === p) {
      const k = Math.min(1, (performance.now() - chessAnim.start)/400);
      X = x + (chessAnim.fx + (p.x - chessAnim.fx)*k)*cell + .5;
      Y = y + (chessAnim.fy + (p.y - chessAnim.fy)*k)*cell + .5 - Math.sin(k*Math.PI)*4;
      if (k >= 1) chessAnim = null;

    ctx.fillStyle = p.c === 0 ? '#f4f4ee' : '#1c1c26';

  ctx.fillStyle = '#3a2415'; ctx.fillRect(DIR_OFFICE.x - 4, DIR_OFFICE.y, 42, 24);
  ctx.fillStyle = '#6b4425'; ctx.fillRect(DIR_OFFICE.x - 2, DIR_OFFICE.y + 2, 38, 18);
  ctx.fillStyle = '#8a5a33'; ctx.fillRect(DIR_OFFICE.x - 2, DIR_OFFICE.y + 2, 38, 2);
  const papers = Math.min(8, Math.floor((DIRETOR.mood - 70) / 2));
  for (let k = 0; k < papers; k++) { ctx.fillStyle = '#f4f4ee'; ctx.fillRect(DIR_OFFICE.x + 4 + (k % 4) * 9, DIR_OFFICE.y + 8 + ((k/4)|0)*5, 7, 4); }
  ctx.fillStyle = '#ffd25c'; ctx.font = 'bold 6px Consolas'; ctx.textAlign = 'center';
  ctx.fillText('DIRETOR', DIR_OFFICE.x + 17, DIR_OFFICE.y - 3); ctx.textAlign = 'left';

  drawChess(); drawDraught(); drawPool(); drawStudyDesks(); drawSubDoor(t); drawLunch(t); drawGym(t); drawMat(t); drawRing(t);
}
function drawChar(a, x, y, dir, frame) {
  const sheet = SHEET[a.name];
  if (!sheet || !sheet.complete || !sheet.naturalWidth) return;
  ctx.drawImage(sheet, (frame % 4) * FW, (dir % 4) * FH, FW, FH, x|0, y|0, FW, FH);
}
function drawSofa(t) {
  AGENTS.forEach(a => {
    if (a.state === 'SOFA') {
      const i = SEATS.findIndex(s => Math.hypot(s.x - a.px, s.y - a.py) < 14);
      drawChar(a, (i >= 0 ? SEATS[i].x : a.px) - FW/2, SOFA.y + 6, DIR.DOWN, 0);
    }
  });
  const sofa = IMG[NAMES.sofa];
  if (sofa.complete && sofa.naturalWidth) ctx.drawImage(sofa, SOFA.x, SOFA.y, SOFA.w, SOFA.h);
  else { ctx.fillStyle = '#7c1f3a'; ctx.fillRect(SOFA.x, SOFA.y, SOFA.w, SOFA.h); }
}
function drawCarry(a) {
  if (!a.carrying) return;
  ctx.fillStyle = '#f4f4ee'; ctx.fillRect(a.px + 5, a.py - 18, 7, 9);
  ctx.fillStyle = '#b8b8a8'; ctx.fillRect(a.px + 6, a.py - 16, 5, 1); ctx.fillRect(a.px + 6, a.py - 14, 5, 1);
}
function drawAgent(a, t) {
  if (a.state === 'OUT' || a.state === 'SOFA') return;
  ctx.globalAlpha = .35; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(a.px, a.py + 2, 8, 3, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  if (a.state === 'NAP' || a.state === 'GYM' || a.state === 'STUDY' || a.state === 'EAT') {
    // desenhados nos moveis; so nome e balao aqui
  } else {
    const moving = a.state.startsWith('TO_');
    drawChar(a, a.px - FW/2, a.py - FH + 4, a.dir, moving ? (a.frame | 0) : 0);
    drawCarry(a);
    if (a.state === 'CLEAN') {
      ctx.strokeStyle = '#8a5a33'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(a.px + 6, a.py - 4); ctx.lineTo(a.px + 11, a.py + 8); ctx.stroke();
      ctx.fillStyle = '#cfd2da'; ctx.fillRect(a.px + 9, a.py + 7, 5, 2);
    }
    if (a.state === 'CHESS' || a.state === 'DRAUGHT' || a.state === 'POOL') {
      // peca de jogo na mao
      ctx.fillStyle = '#f4f4ee'; ctx.fillRect(a.px + 6, a.py - 16, 3, 4);
    }
  }
  ctx.font = 'bold 7px Consolas'; ctx.textAlign = 'center';
  const w = a.name.length * 5 + 6;
  ctx.fillStyle = 'rgba(8,9,12,.72)'; ctx.fillRect(a.px - w/2, a.py + 4, w, 9);
  ctx.fillStyle = '#9ff'; ctx.fillText(a.name, a.px, a.py + 5);
  ctx.textAlign = 'left';
  // emocao visivel (minima)
  if (a.emotionUntil > t && a.emotion) {
    ctx.font = '8px Consolas'; ctx.textAlign = 'center';
    ctx.fillText(a.emotion, a.px + w/2 + 7, a.py + 6);
    ctx.textAlign = 'left';
  }
  if (a.bubble && t < a.bubbleUntil) {
    const txt = a.bubble.length > 28 ? a.bubble.slice(0, 27) + '…' : a.bubble;
    const bw = Math.min(250, 10 + txt.length * 5), bh = 16;
    const bx = Math.max(4, Math.min(LW - bw - 4, a.px - bw/2)), by = a.py - FH - 16;
    ctx.globalAlpha = .95; ctx.fillStyle = '#f4f4ee';
    ctx.fillRect(bx, by, bw, bh); ctx.fillRect(a.px - 3, by + bh, 6, 4);
    ctx.font = '8px Consolas'; ctx.fillStyle = '#1a1c24'; ctx.fillText(txt, bx + 5, by + 5);
    ctx.globalAlpha = 1;
  }
}
const ST_ICON = { WORK:'💻', TO_WORK:'💻', COOLER:'💧', TO_COOLER:'💧', SOFA:'🛋', TO_SOFA:'🛋',
  STUDY:'📚', TO_STUDY:'📚', EAT:'🍽', TO_EAT:'🍽', GYM:'💪', TO_GYM:'💪', NAP:'😴', TO_NAP:'😴',
  CLEAN:'🧹', TO_CLEAN:'🧹', CHESS:'♟', TO_CHESS:'♟', DRAUGHT:'⚪', TO_DRAUGHT:'⚪',
  POOL:'🎱', TO_POOL:'🎱', CHAT:'🗣', TO_CHAT:'🗣', PROCESS:'🌉', TO_BOSS:'📄', HANDOFF:'🤝',
  TO_DOOR:'🚪', OUT:'🚪' };
function drawRoster() {
  document.getElementById('roster').innerHTML = AGENTS.map(a => {
    const cls = a.state === 'OUT' ? 'out' : '';
    const label = a.state === 'OUT'
      ? `${a.name} 🚪→ ${a.outDest || 'fora'}`
      : `${a.name} ${ST_ICON[a.state] || '🚶'} ${a.energy.toFixed(0)}%`;
    return `<div class="chip ${cls}">${label}</div>`;
  }).join('');
}

// ---------------- loop ----------------
function render(t) {
  ctx.fillStyle = '#0a0c10'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.translate(offX, offY); ctx.scale(scale, scale); ctx.imageSmoothingEnabled = false;

  drawRoom(t);
  drawMob(t);

  const vis = AGENTS.filter(a => a.state !== 'OUT' && a.state !== 'SOFA');
  vis.forEach(a => {
    if (a.state.startsWith('TO_')) {
      const dx = a.tx - a.px, dy = a.ty - a.py, d = Math.hypot(dx, dy);
      if (d > 2) {
        a.px += dx/d * .8; a.py += dy/d * .8; a.frame = (a.frame + .11) % 4;
        a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
      }
    }
  });
  vis.forEach(collide);
  separate(vis);
  AGENTS.forEach(a => brain(a, t));
  dispatchTasks();
  chessStep(t); draughtStep(t); ballsStep(); dustStep(t); riderStep(t);

  [...vis].sort((a, b) => a.py - b.py).forEach(a => drawAgent(a, t));
  drawSofa(t);
  RIDERS.forEach(r => drawRider(r, t));

  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, 'rgba(0,0,0,.30)'); g.addColorStop(.2, 'transparent');
  g.addColorStop(.85, 'transparent'); g.addColorStop(1, 'rgba(0,0,0,.40)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  ctx.restore();
  drawRoster();
  requestAnimationFrame(render);
}
// ---------------- chat do cliente ----------------
const chatIn = document.getElementById('chatIn');
const chatBtn = document.getElementById('chatSend');
let chatBusy = false;
async function sendChat() {
  const text = chatIn.value.trim();
  if (!text || chatBusy) return;
  chatBusy = true; chatIn.value = '';
  caption('🧑 você: ' + text);
  // um agente livre responde, desenhado como se tivesse vindo falar com você
  const free = AGENTS.filter(a => a.state === 'WORK');
  const a = free.length ? free[(Math.random()*free.length)|0] : DIRETOR;
  a.px = 135; a.py = 470; a.state = 'CHAT'; a.stateT = 0;
  say(a, '💬 ...', 9000);
  try {
    const r = await fetch('/api/agent-chatter', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ agent: a.name, context: 'o visitante acabou de dizer: "' + text + '". Responda em ate 12 palavras, direto, em portugues' }),
      signal: AbortSignal.timeout(9000)
    });
    const line = r.ok ? ((await r.json()).line || 'beleza!') : 'beleza!';
    say(a, line, 9000);
    setEmotion(a, '😄');
    caption('🤖 @' + a.name + ' respondeu: ' + line);
  } catch { say(a, 'tô meio offline agora...', 6000); }
  setTimeout(() => { backToDesk(a); chatBusy = false; }, 8000);
}
chatBtn.addEventListener('click', sendChat);
chatIn.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

// arranque do loop (o render se reagenda sozinho daqui em diante)
requestAnimationFrame(render);
</script>
