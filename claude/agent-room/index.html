<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BadClaudio — Agent Room</title>
<link rel="icon" href="/claudio.ico">
<style>
  :root { --r:#ff164f; --ok:#66ff75; --cy:#18dbff; --bg:#0a0c10; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); font:12px/1.35 Consolas,"Courier New",monospace; overflow:hidden; color:#e8e8ee; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:7; display:flex; gap:8px; align-items:center;
         padding:5px 9px; background:#101218; border-bottom:1px solid #3a1520; font-size:11px; }
  #bar .brand { color:var(--r); font-weight:900; letter-spacing:1px; }
  #bar .sp { flex:1; }
  #bar button { background:#171a22; border:1px solid #333a48; color:#cdd3df; font:11px Consolas; padding:3px 9px; cursor:pointer; border-radius:4px; }
  #bar button.on { border-color:var(--cy); color:var(--cy); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; background:#555; vertical-align:middle; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #keysTxt { color:#8f96a4; }
  #world { position:absolute; inset:96px 0 42px 0; overflow:hidden; transition:right .28s cubic-bezier(.2,.8,.3,1); }
  body.panel-open #world { right:min(86vw,320px); }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  /* painel = porta que abre para fora do quadro */
  #panel { position:fixed; top:26px; right:0; bottom:22px; width:min(86vw,320px); z-index:8;
           background:linear-gradient(90deg,#070a0e 0%,#0a0f15 100%); border-left:2px solid #2a3a48;
           box-shadow:-14px 0 24px rgba(0,0,0,.75); display:flex; flex-direction:column;
           transform-origin:right center; transform:perspective(900px) rotateY(-92deg);
           opacity:0; pointer-events:none; transition:transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s; }
  #panel.open { transform:perspective(900px) rotateY(0deg); opacity:1; pointer-events:auto; }
  /* puxador/maçaneta da porta */
  #panel .head::before { content:''; display:inline-block; width:9px; height:9px; border:2px solid var(--cy);
                         border-radius:50%; margin-right:2px; }
  #panel .head { display:flex; align-items:center; gap:6px; padding:6px 8px; background:#0d1218;
                 border-bottom:1px solid #22303a; font-size:10px; color:var(--cy); letter-spacing:1px; }
  #panel .head .x { margin-left:auto; cursor:pointer; color:#77808f; padding:0 4px; }
  #log { flex:1; overflow-y:auto; padding:6px 8px; font-size:10.5px; line-height:1.5; }
  #log .ln { margin:0 0 2px; word-wrap:break-word; }
  #log .t { color:#4d5a68; }
  #log .who { color:var(--cy); }
  #log .me { color:#ffd25c; }
  #log .sys { color:#7dffa0; }
  #composer { display:flex; gap:4px; padding:6px; border-top:1px solid #22303a; background:#0b1016; }
  #composer input { flex:1; min-width:0; background:#0a0f14; border:1px solid #24313c; color:#dfe6ee;
                    font:11px Consolas; padding:5px 7px; border-radius:3px; }
  #composer input:focus { outline:none; border-color:var(--r); }
  #composer button { background:var(--r); border:0; color:#fff; padding:0 11px; border-radius:3px; cursor:pointer; font-weight:700; }
  #faixaMascote { position:fixed; left:0; right:0; top:26px; height:0; z-index:6; pointer-events:none; }
  #mascote { position:fixed; top:32px; left:50%; transform:translateX(-50%); z-index:9;
             cursor:pointer; transition:top .9s cubic-bezier(.2,.8,.3,1), left .9s cubic-bezier(.2,.8,.3,1),
             right .9s cubic-bezier(.2,.8,.3,1), bottom .9s cubic-bezier(.2,.8,.3,1), transform .9s; }
  #mascote canvas { display:block; filter:drop-shadow(0 0 10px rgba(255,22,79,.55)); }
  body.panel-open #mascote { top:auto; bottom:64px; left:auto; right:14px; transform:none; animation:passo .5s ease-in-out infinite alternate; }
  @keyframes passo { from { transform:translateY(0) } to { transform:translateY(-3px) } }
  #mascBubble { position:absolute; top:50%; left:calc(100% + 8px); right:auto; transform:translateY(-50%);
                background:#f4f4ee; color:#1a1c24; font:bold 9px Consolas; padding:3px 7px;
                border-radius:6px; white-space:nowrap; }
  #mascBubble::after { content:''; position:absolute; top:50%; right:100%; left:auto; transform:translateY(-50%);
                       border:5px solid transparent; border-right-color:#f4f4ee; }
  body.panel-open #mascBubble { top:auto; bottom:calc(100% + 6px); left:50%; right:auto; transform:translateX(-50%); }
  body.panel-open #mascBubble::after { top:100%; bottom:auto; right:auto; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:#f4f4ee; }
  #roster { position:fixed; left:0; right:0; bottom:0; z-index:7; display:flex; gap:5px; padding:3px 7px;
            overflow-x:auto; background:#0b0d13; border-top:1px solid #23262e; }
  .chip { flex:0 0 auto; padding:2px 7px; background:#151821; border:1px solid #2a2e3a; border-radius:10px;
          font-size:9.5px; white-space:nowrap; }
  .chip.out { border-color:#ff8a5c; color:#ffbf9d; }
  #toast { position:fixed; left:8px; bottom:46px; max-width:70%; background:#12141a; border:1px solid var(--r);
           border-left:4px solid var(--r); padding:5px 8px; font-size:10px; opacity:0; transition:opacity .4s; z-index:9; }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">BADCLAUDIO</span>
  <span><span class="dot" id="dot"></span><span id="statusTxt">…</span></span>
  <span id="keysTxt"></span>
  <span class="sp"></span>
  <button id="btnLog" title="abrir o terminal de texto do escritório">▤ LOG</button>
</div>
<div id="world"><canvas id="cv"></canvas></div>

<div id="panel">
  <div class="head">TERMINAL DO ESCRITÓRIO <span class="x" id="btnClose">✕</span></div>
  <div id="log"></div>
  <div id="composer">
    <input id="chatIn" placeholder="fale com o escritório…" maxlength="120" autocomplete="off">
    <button id="chatSend">➤</button>
  </div>
</div>

<div id="faixaMascote"></div>
<div id="mascote" title="Clica em mim!">
  <div id="mascBubble">Clica em mim!</div>
  <canvas id="masc" width="46" height="50"></canvas>
</div>
<div id="roster"></div>
<div id="toast"></div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const LW = 300, LH = 600;
let scale = 1, offX = 0, offY = 0;
function resize() {
  const w = window.innerWidth, h = window.innerHeight - 68;
  cv.width = w; cv.height = h;
  scale = Math.min(w / LW, h / LH);
  offX = (w - LW * scale) / 2; offY = (h - LH * scale) / 2;
}
window.addEventListener('resize', resize); resize();

const FW = 24, FH = 32;
const DIR = { DOWN:0, LEFT:1, RIGHT:2, UP:3 };

const IMG = {};
const SRC = {
  station:'office_dev_station.png', rack:'office_server_rack.png', sofa:'office_leather_sofa.png',
  cooler:'office_water_cooler.png', plant:'office_plant_ficus.png', chair:'office_chair_executive.png',
  floor:'floor_wood_noble.png', window:'wall_north_window.png', wall:'wall_texture_limezu.png',
  sofaFrontal:'sofa_frontal.png', mesaFrontal:'mesa_frontal.png', estante:'estante.png', armario:'armario.png', balcao:'balcao.png'
};
const load = n => (IMG[n] = Object.assign(new Image(), { src:'assets/' + n }));
Object.values(SRC).forEach(load);
const SHEET = {
  Diretor:load('director_executive.png'), 'Dev Sr':load('godot_senior_dev.png'),
  Pesquisa:load('ai_researcher.png'), QA:load('qa_auditor.png'),
  Infra:load('infra_devops.png'), Arte:load('concept_artist.png')
};

const DESK_W = 78, DESK_H = 60;
const DESKS = [];
[ [8,110,212], [8,110,212] ].forEach((row,r) => row.forEach(x => DESKS.push({ x, y: 44 + r*62, w:DESK_W, h:DESK_H })));

const RACK    = { x: 244, y: 192, w: 54, h: 94 };
const SOFA    = { x: 6,   y: 288, w: 84, h: 56 };
const COOLER  = { x: 264, y: 292, w: 32, h: 50 };
const PLANT1  = { x: 2,   y: 214, w: 36, h: 60 };
const PLANT2  = { x: 262, y: 372, w: 36, h: 60 };
const POOL    = { x: 104, y: 292, w: 90, h: 54 };
const CHESS   = { x: 104, y: 374, w: 56, h: 56 };
const DRAUGHT = { x: 168, y: 374, w: 56, h: 56 };
const STUDY_A = { x: 232, y: 376, w: 62, h: 44 };
const STUDY_B = { x: 6,   y: 376, w: 62, h: 44 };
const RING    = { x: 116, y: 446, w: 66, h: 66 };
const SUBDOOR = { x: 6,   y: 466, w: 32, h: 42 };
const LUNCH   = { x: 48,  y: 472, w: 50, h: 30 };
const GYM     = { x: 108, y: 524, w: 42, h: 30 };
const MAT     = { x: 158, y: 524, w: 56, h: 26 };
const BOSS    = { x: 232, y: 520, w: 46, h: 32 };
const DOOR    = { x: 130, y: 2,   w: 36, h: 24 };

const OBSTACLES = [RACK,SOFA,COOLER,PLANT1,PLANT2,POOL,CHESS,DRAUGHT,STUDY_A,STUDY_B,RING,SUBDOOR,LUNCH,GYM,MAT,BOSS,
  ...DESKS.map(d=>({x:d.x,y:d.y,w:d.w,h:d.h}))];
const AR = 7;
function collide(a) {
  for (const o of OBSTACLES) {
    const nx = Math.max(o.x, Math.min(a.px, o.x + o.w)), ny = Math.max(o.y, Math.min(a.py, o.y + o.h));
    const dx = a.px - nx, dy = a.py - ny, d2 = dx*dx + dy*dy;
    if (d2 < AR*AR) {
      if (d2 > .01) { const d = Math.sqrt(d2); a.px = nx + dx/d*AR; a.py = ny + dy/d*AR; }
      else {
        const l=a.px-o.x, r=o.x+o.w-a.px, t=a.py-o.y, b=o.y+o.h-a.py, m=Math.min(l,r,t,b);
        if (m===l) a.px=o.x-AR; else if (m===r) a.px=o.x+o.w+AR; else if (m===t) a.py=o.y-AR; else a.py=o.y+o.h+AR;
      }
    }
  }
  a.px = Math.max(10, Math.min(LW-10, a.px));
  a.py = Math.max(24, Math.min(LH-8, a.py));
}
function separate(list) {
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++) {
    const A=list[i], B=list[j], dx=B.px-A.px, dy=B.py-A.py, d=Math.hypot(dx,dy);
    if (d>.01 && d<AR*2) { const p=(AR*2-d)/2; A.px-=dx/d*p; A.py-=dy/d*p; B.px+=dx/d*p; B.py+=dy/d*p; }
  }
}

const logEl = document.getElementById('log');
const panel = document.getElementById('panel');
const logLines = [];
function clock() { const d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function logWrite(kind, who, text) {
  logLines.push({ kind: kind, who: who, text: text, at: clock() });
  if (logLines.length > 120) logLines.shift();
  renderLog();
}
function renderLog() {
  logEl.innerHTML = logLines.map(l => {
    const who = l.who ? '<span class="who">@' + l.who + '</span> ' : '';
    const cls = l.kind === 'me' ? 'me' : l.kind === 'sys' ? 'sys' : '';
    return '<p class="ln"><span class="t">' + l.at + '</span> ' + who + '<span class="' + cls + '">' + l.text + '</span></p>';
  }).join('');
  logEl.scrollTop = logEl.scrollHeight;
}
function openPanel(open) {
  panel.classList.toggle('open', open);
  document.body.classList.toggle('panel-open', open);
  document.getElementById('btnLog').classList.toggle('on', open);
  if (open) setTimeout(() => document.getElementById('chatIn').focus(), 240);
}
document.getElementById('btnLog').onclick = () => openPanel(!panel.classList.contains('open'));
document.getElementById('btnClose').onclick = () => openPanel(false);

function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.style.opacity = 1;
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 3500);
}

let room = { online:false, keys:0, models:0, requests:0 };
let lastReq = -1, taskQueue = [];
async function poll() {
  try { room = await (await fetch('/api/room-status')).json(); }
  catch { room = { online:false, keys:0, models:0, requests:0 }; }
  document.getElementById('dot').className = 'dot' + (room.online ? ' on' : '');
  document.getElementById('statusTxt').textContent = room.online ? 'ponte online' : 'ponte offline';
  document.getElementById('keysTxt').textContent = room.online ? room.keys + ' canais • ' + (room.requests||0) + ' reqs' : '';
  if (lastReq >= 0 && room.requests > lastReq) {
    const n = Math.min(room.requests - lastReq, 2);
    for (let k = 0; k < n; k++) taskQueue.push(1);
    spawnRider();
    logWrite('sys', null, 'chegou pedido novo na ponte — motoboy já saiu');
    toast('⚡ requisição na ponte');
  }
  lastReq = room.requests || 0;
  if (room.online && !poll.was) logWrite('sys', null, 'ponte ligada: ' + room.keys + ' canais ativos');
  if (!room.online && poll.was === true) logWrite('sys', null, 'ponte caiu — time em plantão');
  poll.was = room.online;
}
poll.was = false; poll(); setInterval(poll, 5000);

let lastChatter = 0;
async function agentChatter(agent, context) {
  const now = Date.now();
  if (now - lastChatter < 9000) return null;
  lastChatter = now;
  try {
    const r = await fetch('/api/agent-chatter', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ agent: agent, context: context }), signal: AbortSignal.timeout(8000) });
    return r.ok ? ((await r.json()).line || null) : null;
  } catch { return null; }
}

const AGENTS = ['Diretor','Dev Sr','Pesquisa','QA','Infra','Arte'].map((name,i) => {
  const d = DESKS[i];
  return { name: name, idx:i, desk:d, px:d.x+d.w/2, py:d.y+d.h+14, tx:0, ty:0,
    dir:DIR.DOWN, frame:0, state:'WORK', stateT:0,
    energy:55+Math.random()*45, mood:70, bubble:null, bubbleUntil:0,
    next:4000+Math.random()*6000, outDest:null, outUntil:0, carrying:false,
    emotion:'', emotionUntil:0, target:null };
});
const DIRETOR = AGENTS[0];
const ACT = {
  WORK:'trabalhando', TO_WORK:'voltando à mesa', COOLER:'bebendo água', TO_COOLER:'indo beber água',
  SOFA:'descansando', TO_SOFA:'indo descansar', STUDY:'estudando', TO_STUDY:'indo estudar',
  EAT:'almoçando', TO_EAT:'indo almoçar', GYM:'treinando', TO_GYM:'indo treinar',
  NAP:'cochilando', TO_NAP:'indo cochilar', CLEAN:'limpando', TO_CLEAN:'indo limpar',
  CHESS:'jogando xadrez', TO_CHESS:'indo ao xadrez', DRAUGHT:'jogando damas', TO_DRAUGHT:'indo às damas',
  POOL:'jogando sinuca', TO_POOL:'indo à sinuca', WING:'treinando wing chun', TO_WING:'indo ao ringue',
  CHAT:'conversando', TO_CHAT:'indo conversar', ARGUE:'discordando', TO_ARGUE:'indo discutir',
  PROCESS:'no rack', TO_BOSS:'levando relatório', HANDOFF:'entregando relatório',
  TO_DOOR:'saindo', OUT:'fora'
};
const DEST = ['deploy em produção','manutenção do Canal #7','buscar tokens','reunião com o provedor',
  'auditar a cascata','ajustar latência','backup do gabinete','revisar logs'];

let falaAtual = null;   // so uma fala na cena por vez, para nao empilhar baloes
function say(a, text, dur) {
  AGENTS.forEach(x => { if (x !== a) { x.bubble = null; x.bubbleUntil = 0; } });
  a.bubble = text;
  a.bubbleUntil = performance.now() + (dur || 4200);
  falaAtual = a.name;
}
function goTo(a, x, y, state, target) { a.tx=x; a.ty=y; a.state=state; a.stateT=0; a.target=target||null; }
function arrived(a) { return Math.hypot(a.tx-a.px, a.ty-a.py) < 3; }
function backToDesk(a) { a.target=null; goTo(a, a.desk.x+a.desk.w/2, a.desk.y+a.desk.h+14, 'TO_WORK'); }
function setEmotion(a, e, dur) { a.emotion = e; a.emotionUntil = performance.now() + (dur||7000); }

const SEATS = [{ x: SOFA.x+24, y: SOFA.y+46 }, { x: SOFA.x+62, y: SOFA.y+46 }];
const SEAT_TAKEN = {};
const STUDY_SEATS = [
  { x: STUDY_A.x+STUDY_A.w/2, y: STUDY_A.y+STUDY_A.h+14 },
  { x: STUDY_B.x+STUDY_B.w/2, y: STUDY_B.y+STUDY_B.h+14 }
];
const STUDY_TAKEN = {};
let chessPlayers=[], damaPlayers=[], poolPlayers=[], dust=[];

function trabalharNaMesa(a) {
  const tarefas = ['fechando a tarefa do dia', 'revisando o código', 'rodando os testes',
                   'ajustando o layout', 'corrigindo um bug', 'escrevendo a documentação'];
  const t = tarefas[(Math.random()*tarefas.length)|0];
  goTo(a, a.desk.x + a.desk.w/2, a.desk.y + a.desk.h + 14, 'TO_WORK');
  a.emFoco = performance.now() + 7000;
  dizerAgente(a.name, t);
}
function dizerAgente(nome, texto) {
  const ag = AGENTS.find(x => x.name === nome);
  if (ag) { say(ag, texto, 4500); logWrite('', nome, texto); }
}
function startDelivery(a) {
  a.carrying = true;
  goTo(a, BOSS.x-14, BOSS.y+16, 'TO_BOSS');
  const ENTREGAS = [
    'acabei o que estava fazendo, vou mostrar pro Diretor',
    'terminei e vou passar pro chefe',
    'fechei a tarefa, indo entregar',
    'deu certo, vou levar pro Diretor ver'
  ];
  const fala = ENTREGAS[(Math.random()*ENTREGAS.length)|0];
  logWrite('', a.name, fala);
  say(a, fala, 5000);
}
function pickActivity(a) {
  const r = Math.random();
  if (r < .34) return trabalharNaMesa(a);      // 34%: continua produzindo
  if (r < .42) return startDelivery(a);
  if (r < .52) {
    const i = SEATS.findIndex((s,k) => !SEAT_TAKEN['s'+k]);
    if (i >= 0) { SEAT_TAKEN['s'+i] = a.name; goTo(a, SEATS[i].x, SEATS[i].y, 'TO_SOFA'); say(a, 'descansando um pouco'); return; }
    return startDelivery(a);
  }
  if (r < .60) {
    const i = STUDY_SEATS.findIndex((s,k) => !STUDY_TAKEN['t'+k]);
    if (i >= 0) { STUDY_TAKEN['t'+i] = a.name; goTo(a, STUDY_SEATS[i].x, STUDY_SEATS[i].y, 'TO_STUDY'); say(a, 'estudando'); return; }
    return startDelivery(a);
  }
  if (r < .66) { goTo(a, LUNCH.x+LUNCH.w/2, LUNCH.y+LUNCH.h+14, 'TO_EAT');  say(a, 'almoçando'); return; }
  if (r < .71) { goTo(a, GYM.x+GYM.w/2, GYM.y+GYM.h+12, 'TO_GYM');           say(a, 'treinando'); return; }
  if (r < .76) { goTo(a, MAT.x+MAT.w/2, MAT.y+MAT.h+12, 'TO_NAP');           say(a, 'tirando um cochilo'); return; }
  if (r < .80 && dust.length) {
    const d = dust[(Math.random()*dust.length)|0];
    goTo(a, d.x, d.y+12, 'TO_CLEAN', d); say(a, 'limpando a bagunça'); return;
  }
  if (r < .84) {
    a.outDest = DEST[(Math.random()*DEST.length)|0];
    goTo(a, DOOR.x+DOOR.w/2, DOOR.y+30, 'TO_DOOR');
    logWrite('', a.name, 'saiu do escritório pra ' + a.outDest);
    say(a, 'saindo pra ' + a.outDest, 5000); return;
  }
  if (r < .89) { goTo(a, CHESS.x+(a.idx%2?8:CHESS.w-8), CHESS.y+CHESS.h+12, 'TO_CHESS'); say(a, 'jogando xadrez'); return; }
  if (r < .93) { goTo(a, DRAUGHT.x+(a.idx%2?8:DRAUGHT.w-8), DRAUGHT.y+DRAUGHT.h+12, 'TO_DRAUGHT'); say(a, 'jogando damas'); return; }
  if (r < .96) { goTo(a, POOL.x+(a.idx%2?6:POOL.w-6), POOL.y+POOL.h+12, 'TO_POOL'); say(a, 'jogando sinuca'); return; }
  if (r < .98) {
    goTo(a, RING.x+(a.idx%2?10:RING.w-10), RING.y+RING.h+12, 'TO_WING');
    logWrite('', a.name, 'foi ao ringue treinar Wing Chun');
    say(a, 'treinando wing chun'); return;
  }
  startArgument(a);
}

const TOPICS = ['tabs ou espaços','monolito ou microsserviços','Python ou TypeScript','REST ou GraphQL',
  'deploy na sexta','cache agressivo','testar tudo','documentar ou codar mais'];
const arguing = new Set();
function startArgument(a) {
  const other = AGENTS.find(g => g !== a && g.state === 'WORK' && !arguing.has(g.name));
  if (!other) { goTo(a, 70+Math.random()*120, 252+Math.random()*20, 'TO_CHAT'); return; }
  const topic = TOPICS[(Math.random()*TOPICS.length)|0];
  arguing.add(a.name); arguing.add(other.name);
  goTo(a, 164, 254, 'TO_ARGUE'); goTo(other, 184, 254, 'TO_ARGUE');
  setEmotion(a, '😠'); setEmotion(other, '😤');
  say(a, '😤 ' + topic + ': discordo!', 7000);
  logWrite('', a.name, 'discordou do ' + other.name + ' sobre ' + topic);
  agentChatter(a.name, 'discorda do colega sobre ' + topic + ', defenda seu lado em 10 palavras')
    .then(l => { if (l) { say(a, l, 6500); logWrite('', a.name, l); } });
  setTimeout(() => agentChatter(other.name, 'defende seu ponto sobre ' + topic + ' contra o colega, em 10 palavras')

    case 'TO_COOLER': if (arrived(a)) { a.state='COOLER'; a.stateT=0; } break;

function drawAgent(a, t) {
  if (a.state === 'OUT' || a.state === 'SOFA') return;

  ctx.globalAlpha = .32; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(a.px, a.py+2, 8, 3, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  if (a.state === 'TRIP') {
    ctx.fillStyle = '#232530'; ctx.fillRect(a.px-9, a.py-6, 18, 6);
    ctx.fillStyle = '#e8b088'; ctx.fillRect(a.px+8, a.py-8, 6, 6);
    ctx.fillStyle = '#ffcf5c'; ctx.font = 'bold 8px Consolas'; ctx.textAlign = 'center';
    ctx.fillText('💫', a.px, a.py-16); ctx.textAlign = 'left';
  } else if (hiddenInFurniture.indexOf(a.state) < 0) {
    const moving = a.state.indexOf('TO_') === 0;
    drawChar(a, a.px-FW/2, a.py-FH+4, a.dir, moving ? (a.frame|0) : 0);
    drawCarry(a);
    if (a.state === 'CLEAN') {
      ctx.strokeStyle = '#8a5a33'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(a.px+6, a.py-4); ctx.lineTo(a.px+11, a.py+8); ctx.stroke();

  let labelOffset = 0;
  for (const o of AGENTS) {
    if (o === a || o.state === 'OUT') continue;
    if (Math.abs(o.px - a.px) < 26 && Math.abs(o.py - a.py) < 22 && o.idx < a.idx) labelOffset += 9;
  }
  if (labelOffset > 18) labelOffset = 18;

    const txt = a.bubble.length > 26 ? a.bubble.slice(0,25)+'…' : a.bubble;

const chatIn = document.getElementById('chatIn');
const chatBtn = document.getElementById('chatSend');
let chatBusy = false;
async function sendChat() {
  const text = chatIn.value.trim();
  if (!text || chatBusy) return;
  openPanel(true);
  chatBusy = true; chatIn.value = '';
  logWrite('me', null, text);
  const free = AGENTS.filter(a => a.state === 'WORK');
  const a = free.length ? free[(Math.random()*free.length)|0] : DIRETOR;
  a.px = 150; a.py = 300; a.state = 'CHAT'; a.stateT = 0;
  setEmotion(a, '👀');
  try {
    const r = await fetch('/api/agent-chatter', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ agent: a.name, context: 'o visitante escreveu: "' + text + '". Responda em ate 14 palavras, em portugues' }),
      signal: AbortSignal.timeout(10000) });
    const line = r.ok ? ((await r.json()).line || 'beleza!') : 'beleza!';
    say(a, line, 9000); setEmotion(a, '😄'); logWrite('', a.name, line);
  } catch {
    say(a, 'tô meio offline agora…', 6000);
    logWrite('', a.name, 'tô meio offline agora…');
  }
  setTimeout(() => { backToDesk(a); chatBusy = false; }, 7000);
}

function render(t) {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#0a0c10'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.translate(offX, offY); ctx.scale(scale, scale); ctx.imageSmoothingEnabled = false;

  drawRoom(t);
  drawMob(t);

  const vis = AGENTS.filter(a => a.state !== 'OUT' && a.state !== 'SOFA');
  vis.forEach(a => {
    if (a.state.indexOf('TO_') === 0) {
      const dx = a.tx-a.px, dy = a.ty-a.py, d = Math.hypot(dx,dy);
      if (d > 3) {
        a.px += dx/d*.8; a.py += dy/d*.8; a.frame = (a.frame+.11)%4;
        a.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?DIR.RIGHT:DIR.LEFT) : (dy>0?DIR.DOWN:DIR.UP);
      }
    }
  });
  vis.forEach(collide);
  separate(vis);
  AGENTS.forEach(a => brain(a, t));
  dispatchTasks();
  chessStep(t); draughtStep(t); ballsStep(); dustStep(); riderStep(t); eventsStep(t);

  vis.slice().sort((a,b) => a.py-b.py).forEach(a => drawAgent(a, t));
  drawSofa();
  RIDERS.forEach(r => drawRider(r, t));
  drawEvents(t);

  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, 'rgba(0,0,0,.28)'); g.addColorStop(.18, 'transparent');
  g.addColorStop(.86, 'transparent'); g.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  ctx.restore();

  drawRoster();
  requestAnimationFrame(render);
}
