<!DOCTYPE html>
<html lang="pt-BR" class="czs-enxame-offline czs-swarm-offline czs-agente-vivo-offline">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BADCLAUDE — pagamento</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07080a; --panel:#0f1115; --line:#22262e; --ink:#f2f3f7;
    --dim:#8a8f9c; --acc:#22d3ee; --red:#e11d2e; --green:#10b981;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; line-height:1.55;
    display:grid; place-items:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(60% 40% at 20% 0%, rgba(34,211,238,.10), transparent 70%),
               radial-gradient(50% 50% at 85% 15%, rgba(225,29,46,.08), transparent 70%);
  }
  .card {
    position:relative; z-index:1; width:min(560px,100%);
    background:linear-gradient(180deg, var(--panel), #0b0d11);
    border:1px solid var(--line); border-radius:22px; padding:30px 30px 26px;
    box-shadow:0 40px 100px -50px rgba(0,0,0,.95);
  }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .brand b { font-size:12.5px; letter-spacing:.2em; }
  .brand span { display:block; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  h1 { font-size:clamp(1.5rem,4vw,2rem); letter-spacing:-.03em; margin-bottom:6px; }
  .lead { color:var(--dim); font-size:14px; margin-bottom:24px; }
  .plan-box {
    border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:20px;
    background:#0b0d11;
  }
  .plan-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .plan-name { font-weight:600; font-size:15px; }
  .plan-price { font-size:24px; font-weight:700; letter-spacing:-.03em; color:var(--acc); }
  .plan-desc { color:var(--dim); font-size:12.5px; margin-top:6px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  .field input, .field select {
    width:100%; padding:11px 13px; border-radius:10px; background:#0a0c10;
    border:1px solid var(--line); color:var(--ink); font:400 14px 'Inter',sans-serif;
  }
  .field input:focus, .field select:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(34,211,238,.13); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn {
    width:100%; padding:14px 18px; margin-top:8px; border:0; border-radius:11px;
    background:var(--acc); color:#04191d; font-weight:700; font-size:14.5px; cursor:pointer;
    transition:filter .2s, transform .12s;
  }
  .btn:hover { filter:brightness(1.08); }
  .btn:active { transform:translateY(1px); }
  .btn[disabled] { opacity:.55; cursor:progress; }
  .msg { min-height:20px; margin-top:12px; font-size:12.5px; color:var(--red); }
  .divider { display:flex; align-items:center; gap:12px; margin:20px 0 16px; color:#5f6470; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--line); }
  .pix { text-align:center; }
  .pix[hidden], .pay-mp[hidden] { display:none; }
  .pix img { width:190px; height:190px; background:#fff; border-radius:14px; padding:10px; display:block; margin:0 auto 14px; }
  .pix-code {
    font-family:'JetBrains Mono',monospace; font-size:10.5px; word-break:break-all;
    background:#0a0c10; border:1px solid var(--line); border-radius:10px;
    padding:10px; color:#a9b0bd; max-height:74px; overflow:auto; text-align:left;
  }
  .copy { margin-top:10px; }
  .copy-btn {
    padding:9px 16px; border-radius:999px; border:1px solid var(--acc);
    background:none; color:var(--acc); font-size:12px; cursor:pointer; font-weight:600;
  }
  .copy-btn:hover { background:rgba(34,211,238,.1); }
  .note { font-size:11.5px; color:#5f6470; margin-top:14px; line-height:1.6; }
  .back { display:inline-block; margin-top:18px; color:var(--dim); font-size:12px; text-decoration:none; }
  .back:hover { color:var(--ink); }
  .spinner {
    width:16px; height:16px; border:2px solid rgba(4,25,29,.35); border-top-color:#04191d;
    border-radius:50%; display:inline-block; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:7px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:520px) { .grid2 { grid-template-columns:1fr; } .card { padding:22px 18px; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="4" y="6" width="24" height="22" rx="6" fill="#141417" stroke="#e11d2e" stroke-width="1.4"/>
      <path d="M4 11.5h24v5.5c-8-3.2-16-3.2-24 0z" fill="#e11d2e"/>
      <circle cx="11" cy="22" r="1.7" fill="#e11d2e"/>
      <circle cx="21" cy="22" r="3" fill="#22d3ee"/>
    </svg>
    <div><b>BADCLAUDE</b><span>pagamento</span></div>
  </div>

  <h1 id="title">Finalizar projeto</h1>
  <p class="lead" id="leadText">Escolha a forma de pagamento. PIX confirma na hora; cartão passa pela página segura do Mercado Pago.</p>

  <div class="plan-box">
    <div class="plan-row">
      <span class="plan-name" id="planName">—</span>
      <span class="plan-price" id="planPrice">—</span>
    </div>
    <p class="plan-desc" id="planDesc">—</p>
  </div>

  <form id="payForm" novalidate>
    <div class="grid2">
      <div class="field">
        <label for="nome">Seu nome</label>
        <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Maria Silva">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="maria@exemplo.com">
      </div>
    </div>
    <div class="field">
      <label for="direcao">Direção escolhida (opcional)</label>
      <select id="direcao" name="direcao">
        <option value="">não sei ainda</option>
        <option value="01">01 · Papel Suíço</option>
        <option value="02">02 · Terminal Vivo</option>
        <option value="03">03 · Editorial Quente</option>
        <option value="04">04 · Espacial 3D</option>
        <option value="05">05 · Brutalista</option>
        <option value="06">06 · Neon Noturno</option>
        <option value="07">07 · Tátil / Clay</option>
        <option value="08">08 · Grid Técnico</option>
        <option value="09">09 · Cinemático</option>
        <option value="10">10 · Kinetic Type</option>
      </select>
    </div>
    <button class="btn" type="submit" id="payBtn">Ir para o pagamento</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <div class="divider" id="pixDivider" hidden>ou pague por PIX</div>
  <section class="pix" id="pixBox" hidden>
    <img id="pixQr" alt="QR Code do PIX">
    <div class="pix-code" id="pixCode"></div>
    <div class="copy"><button class="copy-btn" id="copyPix" type="button">copiar código PIX</button></div>
    <p class="note">Depois de pagar, mande o comprovante no WhatsApp. Liberamos o acesso em minutos.</p>
  </section>

  <a class="back" href="../">← voltar ao showroom</a>
</main>

<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var planoId = (params.get('plano') || 'sistema').toLowerCase();
  var API = '/badclaude/api/pagamento';
  var plano = null;

  var $ = function (id) { return document.getElementById(id); };

  function money(v) {
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0 });
  }

  async function carregar() {
    try {
      var res = await fetch(API + '/planos');
      var data = await res.json();
      var lista = data.planos || [];
      plano = lista.find(function (p) { return p.id === planoId; }) || lista[0];
      if (!plano) throw new Error('nenhum plano');
      $('planName').textContent = plano.nome;
      $('planPrice').textContent = money(plano.preco);
      $('planDesc').textContent = plano.descricao;
      $('direcao').value = params.get('direcao') || '';
      document.title = 'BADCLAUDE — ' + plano.nome;
      if (!data.mercadoPago) {
        $('leadText').textContent = 'Pague por PIX escaneando o código abaixo. A confirmação é manual, pelo comprovante.';
        $('payBtn').hidden = true;
        $('pixDivider').hidden = false;
        carregarPix();
      }
    } catch (e) {
      $('msg').textContent = 'Não foi possível carregar o plano: ' + e.message;
    }
  }

  async function carregarPix() {
    $('pixBox').hidden = false;
    $('pixQr').src = API + '/pix.svg?plano=' + encodeURIComponent(planoId);
    try {
      var res = await fetch(API + '/pix?plano=' + encodeURIComponent(planoId));
      var data = await res.json();
      $('pixCode').textContent = data.copiaECola || '';
    } catch (e) {}
  }

  $('copyPix').addEventListener('click', async function () {
    var code = $('pixCode').textContent;
    try {
      await navigator.clipboard.writeText(code);
      $('copyPix').textContent = 'copiado!';
      setTimeout(function () { $('copyPix').textContent = 'copiar código PIX'; }, 1800);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = code; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
  });

  $('payForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = $('payBtn');
    var nome = $('nome').value.trim();
    var email = $('email').value.trim();
    if (!nome || !email) { $('msg').textContent = 'Preencha nome e e-mail para continuar.'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('msg').textContent = 'E-mail inválido.'; return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>abrindo pagamento…';
    $('msg').textContent = '';
    try {
      var res = await fetch(API + '/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plano: planoId, nome: nome, email: email, direcao: $('direcao').value }),
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'falha ao criar cobrança');
      if (data.initPoint) { location.href = data.initPoint; return; }
      // sem Mercado Pago: cai para PIX
      $('payBtn').hidden = true;
      $('pixDivider').hidden = false;
      carregarPix();
    } catch (err) {
      $('msg').textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Ir para o pagamento';
    }
  });

  carregar();
})();
</script>
</body>
</html>
