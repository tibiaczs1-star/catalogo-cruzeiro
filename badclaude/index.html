<!DOCTYPE html>
<html lang="pt-BR" class="czs-enxame-offline czs-swarm-offline czs-agente-vivo-offline">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BADCLAUDE — escolha o seu build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --void:#05050a; --ink:#f2f3f7; --dim:#7c8090; --acc:#00e5ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--void); color:var(--ink); font-family:'Inter',ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; }

  .genesis { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; z-index:10; }
  .gen-swarm { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }

  .gen-top { position:relative; z-index:3; display:flex; justify-content:space-between; align-items:center; padding:22px clamp(18px,3vw,40px); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  .gen-top b { color:var(--ink); font-weight:500; }

  .gen-pet { position:relative; z-index:2; display:grid; place-items:center; width:min(38vw,300px); aspect-ratio:1; margin:0 auto; transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1); }
  .gen-pet canvas { width:100%; height:100%; }
  .genesis.show-cards .gen-pet { opacity:0; transform:scale(.5) translateY(-30px); pointer-events:none; }

  .gen-copy { position:relative; z-index:3; text-align:center; padding:0 20px; transition:opacity .5s ease, transform .5s ease; }
  .genesis.forming .gen-copy { opacity:0; transform:translateY(-14px); }
  .genesis.show-cards .gen-copy { opacity:0; transform:translateY(-16px); }
  .gen-kicker { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--acc); margin-bottom:16px; }
  .gen-title { font-size:clamp(1.7rem,4.6vw,3.6rem); line-height:1.02; letter-spacing:-.04em; font-weight:600; margin-bottom:14px; }
  .gen-title span { display:block; }
  .gen-title .o { -webkit-text-stroke:1.5px var(--ink); color:transparent; }
  .gen-sub { font-size:clamp(.92rem,1.2vw,1.05rem); color:var(--dim); max-width:44ch; margin:0 auto; line-height:1.6; }

  .gen-grid { position:absolute; left:clamp(18px,3vw,40px); right:clamp(18px,3vw,40px); top:56%; height:40vh; z-index:2; opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1); pointer-events:none; }
  .genesis.show-cards .gen-grid { opacity:1; transform:none; }

  .gen-bottom { position:relative; z-index:3; display:flex; justify-content:space-between; align-items:center; padding:20px clamp(18px,3vw,40px) 26px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:var(--dim); gap:16px; flex-wrap:wrap; }
  .gen-status { color:var(--acc); }
  .gen-hint { opacity:0; transition:opacity .5s ease .2s; }
  .genesis.ready .gen-hint { opacity:1; }

  .gen-skip { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); background:none; border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:8px 14px; cursor:pointer; transition:color .25s, border-color .25s; }
  .gen-skip:hover { color:var(--ink); border-color:var(--ink); }
  .gen-skip:focus-visible { outline:2px solid var(--acc); outline-offset:3px; }

  .genesis.picked .gen-grid, .genesis.picked .gen-copy { opacity:0; transition:opacity .5s ease; }

  @media (max-width:760px) { .gen-grid { top:46%; height:48vh; } .gen-pet { width:52vw; } }
</style>
<base href="/badclaude/">
</head>
<body>

<div class="genesis" id="genesis">
  <canvas class="gen-swarm" aria-hidden="true"></canvas>

  <header class="gen-top">
    <span><b>BADCLAUDE</b> · showroom</span>
    <span id="genClock">--:--:--</span>
  </header>

  <div class="gen-pet">
    <canvas id="genPet" aria-label="Mascote BADCLAUDE" role="img"></canvas>
  </div>

  <div class="gen-copy">
    <p class="gen-kicker">construído em código</p>
    <h1 class="gen-title">
      <span>Eu me construí.</span>
      <span class="o">Eu me desfaço e me refaço.</span>
    </h1>
    <p class="gen-sub">Meu enxame de agentes montou dez sites na sua frente. Escolha um e ele abre — pronto para virar o seu.</p>
  </div>

  <div class="gen-grid" aria-label="Dez builds"></div>

  <footer class="gen-bottom">
    <span class="gen-status" id="genStatus">carregando</span>
    <span class="gen-hint" id="genHint">clique em um build · ou tecle 1 a 0</span>
    <button class="gen-skip" id="genSkip" type="button">mostrar os 10</button>
  </footer>
</div>

<script type="module">
import { Genesis, BUILDS } from './assets/js/genesis.js';
import { BadClawd } from './assets/js/badclawd.js';

const root = document.getElementById('genesis');
const petCanvas = document.getElementById('genPet');

const pet = new BadClawd(petCanvas, { variant: 'ink', accent: '#00e5ff', strokeWidth: 3 });
pet.setState('idle');

const clock = document.getElementById('genClock');
setInterval(() => {
  const d = new Date();
  clock.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map((n) => String(n).padStart(2, '0')).join(':');
}, 1000);

const q = new URLSearchParams(location.search).get('motion');
const reduced = q === '0' ? true : q === '1' ? false : window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const gen = new Genesis(root, {
  reduced,
  onChoose: (build) => {
    location.href = `./directions/${build.id}/?build=${build.id}`;
  },
});

if (reduced) {
  root.classList.add('show-cards', 'ready');
  gen.start();
  gen.say('escolha o seu build');
  setTimeout(() => gen._bindPick(), 120);
} else {
  gen.start();
}

window.addEventListener('pointermove', (e) => {
  const r = petCanvas.getBoundingClientRect();
  pet.pointAt(e.clientX - r.left, e.clientY - r.top);
}, { passive: true });

document.getElementById('genSkip').addEventListener('click', () => {
  root.classList.add('show-cards', 'ready');
  gen.say('escolha o seu build');
  gen._bindPick();
});

window.addEventListener('keydown', (e) => {
  if (!root.classList.contains('ready')) return;
  const idx = '1234567890'.indexOf(e.key);
  if (idx >= 0 && BUILDS[idx]) gen.pick(BUILDS[idx]);
});
</script>
</body>
</html>
