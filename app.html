<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a3d">
  <meta name="description" content="Notícias e vídeos de Cruzeiro do Sul, Vale do Juruá e Acre.">
  <title>Catálogo CZS — Notícias do Juruá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Newsreader:opsz,wght@6..72,700;6..72,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=20260714-1">
</head>
<body>
  <a class="skip-link" href="#newsFeed">Ir para as notícias</a>

  <header class="app-header">
    <a class="brand" href="/app.html" aria-label="Início do Catálogo CZS">
      <img src="/assets/brand/catalogo-czs-logo-offline-horizontal-crop-20260603.webp" alt="" width="156" height="54">
      <span>Vale do Juruá</span>
    </a>
    <div class="live-mark" aria-label="Jornal atualizado"><i></i> Agora</div>
  </header>

  <main>
    <section class="edition-heading" aria-labelledby="editionTitle">
      <p class="edition-kicker" id="editionDate">Última edição</p>
      <h1 id="editionTitle">O que acontece<br>perto de você.</h1>
      <p>Notícias de Cruzeiro do Sul, Vale do Juruá e Acre, em ordem de impacto local.</p>
    </section>

    <nav class="feed-tabs" aria-label="Filtrar conteúdo">
      <button class="feed-tab is-active" type="button" data-filter="all" aria-pressed="true">Últimas</button>
      <button class="feed-tab" type="button" data-filter="video" aria-pressed="false">Vídeos</button>
    </nav>

    <button class="new-news-notice" id="newNewsNotice" type="button" hidden>
      <span>Novas notícias chegaram</span>
      <small>Toque para atualizar</small>
    </button>

    <section class="feed-shell" aria-live="polite" aria-busy="true">
      <div class="feed-status" id="feedStatus">
        <span class="loading-line"></span>
        <span class="loading-line short"></span>
        <span class="loading-line"></span>
      </div>
      <div class="news-feed" id="newsFeed"></div>
    </section>
  </main>

  <footer>
    <img src="/assets/brand/catalogo-czs-logo-offline-horizontal-crop-20260603.webp" alt="Catálogo CZS" width="130" height="45">
    <p>Pesamos fontes. Procuramos a verdade.</p>
  </footer>

  <script src="/app.js?v=20260714-1" defer></script>
</body>
</html>
