<style>
:root{--bg:#F8FAFC;--paper:#FFFFFF;--line:#E5E7EB;--ink:#111827;--muted:#6B7280;--blue:#0F172A;--blue2:#334155;--blueGlow:#EFF6FF;--accent:#2563EB;--gold:#F2CF78;--red:#DC2626;--shadow:0 18px 50px rgba(15,23,42,.10);--shadow2:0 8px 22px rgba(15,23,42,.08);--radius:16px;--display:Manrope,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}
img{max-width:100%;display:block}
.sr{position:absolute;left:-9999px}
.page{width:min(2304px,calc(100vw - 28px));max-width:2304px;margin-left:auto;margin-right:auto;padding:0 clamp(14px,2vw,32px) 56px}
.brandbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(229,231,235,.95);box-shadow:var(--shadow2)}
.brandrow{display:grid;grid-template-columns:auto minmax(300px,1fr) minmax(300px,420px);align-items:center;gap:18px;padding:12px clamp(14px,2vw,24px)}
.brand{display:flex;align-items:center;gap:12px;min-width:270px}
.brand img{width:50px;height:50px}
.brand strong{font-family:var(--display);font-size:28px;line-height:.95;color:var(--blue);letter-spacing:-.04em}
.brand span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.nav{display:flex;gap:12px;flex-wrap:wrap}
.nav a{font-weight:800;font-size:15px;color:var(--blue);padding:8px 10px;border-radius:8px;transition:background .15s}
.nav a:hover{background
