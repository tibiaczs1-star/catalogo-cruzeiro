<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b51d2d"><link rel="icon" href="icons/favicon.png" type="image/png"><title>Equipe · Dom Pedro II Voice</title><link rel="stylesheet" href="assets/minimal.css"><link rel="stylesheet" href="assets/firehouse.css"><link rel="stylesheet" href="assets/vibrant.css"><link rel="stylesheet" href="assets/accessibility.css"><script defer src="assets/accessibility.js"></script></head><body class="team-page"><main class="team-wrap"><header><a href="portal.html">Dom Pedro II Voice</a><h1>Equipe escolar</h1><p>Informações distribuídas conforme a responsabilidade de cada profissional.</p></header><details class="accessibility-options">
