services:
  - type: web
    name: catalogo-cruzeiro-web
    runtime: node
    rootDir: .
    plan: starter
    autoDeployTrigger: commit
    buildCommand: npm install && node agent-os/runtime/generate-manifests.js
    startCommand: node render-start.js
    healthCheckPath: /api/health
    disk:
      name: app-data
      mountPath: /opt/render/project/src/render-data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Rio_Branco
      - key: SITE_URL
        value: https://catalogo-cruzeiro-web.onrender.com
      - key: DATA_DIR
        value: /opt/render/project/src/render-data
      - key: CZS_AI_PRIMARY
        value: ollama
      - key: CZS_OPENAI_FALLBACK_ENABLED
        value: "false"
      - key: CZS_OLLAMA_MODEL
        value: llama3.2:3b
      - key: CZS_OLLAMA_TIMEOUT_MS
        value: "30000"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_AUTH_TOKEN
        sync: false
      - key: REAL_AGENTS_AUTO_RUN_DISABLED
        value: "true"
      - key: NEWS_REFRESH_AUTO_DISABLED
        value: "false"
      - key: NEWS_REFRESH_INTERVAL_MS
        value: "1800000"
      - key: ARTICLE_INTEGRITY_AUTO_RUN_DISABLED
        value: "false"
      - key: TOPIC_FEED_AUTO_REFRESH_DISABLED
        value: "false"
      - key: TOPIC_FEED_AUTO_REFRESH_INTERVAL_MS
        value: "1800000"
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPER_ADMIN_USER
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: FULL_ADMIN_PASSWORD
        sync: false
      - key: CHEFFE_CALL_USER
        sync: false
      - key: CHEFFE_CALL_PASSWORD
        sync: false
      - key: SPRITE_CHECK_PASSWORD
        sync: false
      - key: POLL_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_AUTH_CLIENT_ID
        sync: false
      - key: SITE_AUTH_SESSION_SECRET
        sync: false
      - key: NINJAS_PIX_KEY
        sync: false
      - key: NINJAS_PIX_RECEIVER_NAME
        sync: false
      - key: NINJAS_MERCHANT_NAME
        sync: false
      - key: NINJAS_MERCHANT_CITY
        sync: false
      - key: AGENT_OS_ENABLED
        value: "true"
      - key: AGENT_OS_CYCLE_INTERVAL_MS
        value: "3600000"
      - key: AGENT_OS_CYCLE_ON_START
        value: "true"
      - key: AGENT_OS_LLM_URL
        sync: false
      - key: AGENT_OS_LLM_MODEL
        value: llama3.2:3b
      - key: AGENT_OS_LLM_MAX_TOKENS
        value: "320"
      - key: AGENT_OS_LLM_CONCURRENCY
        value: "1"
  - type: web
    name: ashotelaria-saas
    runtime: node
    rootDir: .
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm run ashotelaria:migrate && npm run ashotelaria:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Rio_Branco
      - key: ASHOTELARIA_DATABASE_URL
        fromDatabase:
          name: ashotelaria-db
          property: connectionString
      - key: ASHOTELARIA_SESSION_SECRET
        sync: false
      - key: ASHOTELARIA_ADMIN_PASSWORD
        sync: false
      - key: ASHOTELARIA_FINANCE_PASSWORD
        sync: false
      - key: ASHOTELARIA_RECEPTION_PASSWORD
        sync: false
      - key: ASHOTELARIA_DEFAULT_PASSWORD
        sync: false
databases:
  - name: ashotelaria-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: ashotelaria
    user: ashotelaria
